    ${edit ? `<div class="btns">${sys ? '<span></span>' : `<button class="btn" data-f="dup">${ic('copy', 17)}Duplikat</button>`}<button class="btn danger" data-f="del">${ic('trash', 17)}Hapus</button></div>` : ''}`;
    const note = $b('#f-note'), amt = $b('#f-amt');
    note.oninput = () => { f.note = note.value; think(); };
    amt.oninput = () => { st.amtManual = true; f.amount = digits(amt.value); amt.value = fmtNum(f.amount); drawPay(); };
    drawType(); drawCats(); drawDetail(); drawHint(); drawPay();
  }
  // Bayar tagihan: kartu akun (logo + saldo) untuk memilih sumber dana.
  function drawPay() {
    const box = $b('#f-pay'); if (!box) return;
    const bal = balances(), ws = activeWallets().filter(w => wGroup(w) !== 'invest');
    box.innerHTML = `<div class="wpick">${ws.map(w => { const b = bal[w.id] || 0, after = b - (f.type === 'income' ? -f.amount : f.amount);
      return `<button class="wp ${w.id === f.walletId ? 'on' : ''}" data-f="payw" data-v="${w.id}">${wicon(w, 'xs')}<span><b>${esc(w.name)}</b><small class="${w.id === f.walletId && after < 0 && wGroup(w) === 'liquid' ? 'exp' : ''}">${money(w.id === f.walletId && f.amount ? after : b)}</small></span></button>`; }).join('')}</div>`;
    const on = box.querySelector('.wp.on'); if (on) on.parentElement.scrollLeft = on.offsetLeft - on.parentElement.offsetLeft - 16;
  }
  function drawType() {
    const box = $b('#f-type'); if (box) box.innerHTML = segHtml('type', [['expense', 'Pengeluaran'], ['income', 'Pemasukan'], ['transfer', 'Transfer']], f.type);
    $b('#f-box').className = 'amt-box ' + (f.type === 'income' ? 'inc' : f.type === 'expense' ? 'exp' : '');
  }
  function drawCats() {
    const box = $b('#f-cats');
    if (f.type === 'transfer' || sys) { box.innerHTML = ''; return; }
    let list = st.all ? cats(f.type) : topCats(f.type, 10);
    const sel = D.categories.find(c => c.id === f.categoryId);
    if (sel) list = [sel].concat(list.filter(c => c !== sel));
    box.innerHTML = `<div class="cchips ${st.all ? 'wrap' : ''}">${list.map(c => `<button class="cch ${f.categoryId === c.id ? 'on' : ''}" data-f="cat" data-v="${c.id}">${itile(c.icon, c.color, 'xs')}<span>${esc(c.name)}</span></button>`).join('')}
      ${st.all ? `<button class="cch more" data-f="newcat">${ic('plus', 16, 'b')}<span>Baru</span></button><button class="cch more" data-f="all"><span>Ringkas</span></button>`
        : `<button class="cch more" data-f="all">${ic('grid', 16)}<span>Semua</span></button>`}</div>`;
    if (!st.all) box.firstElementChild.scrollLeft = 0;
  }
  function drawDetail() {
    const T = f.type;
    const w = wal(f.walletId), to = wal(f.toWalletId);
    $b('#f-detail').innerHTML = `<label class="meta">${w ? wicon(w, 'mn') : ic('wallet', 16)}<span>${esc(w ? w.name : 'Pilih akun')}</span>${ic('chevR', 13)}<select id="f-w">${walletOptions(f.walletId)}</select></label>
      ${T === 'transfer' ? `<label class="meta">${ic('arrowOut', 14)}<span>${esc(to ? to.name : 'Ke akun…')}</span>${ic('chevR', 13)}<select id="f-to"><option value="">Pilih akun</option>${walletOptions(f.toWalletId, f.walletId)}</select></label>
        <label class="meta fee"><span>Biaya</span><input id="f-fee" inputmode="numeric" placeholder="0" value="${fmtNum(f.fee)}"></label>` : ''}
      <label class="meta">${ic('calendar', 15)}<span>${dateLong(f.date)}</span><input id="f-date" type="date" value="${f.date}"></label>
      ${T !== 'transfer' ? `<label class="meta ${f.with ? 'hl' : ''}">${ic((WITH.find(x => x[0] === f.with) || WITH[0])[2], 15)}<span>${withName(f.with)}</span>${ic('chevR', 13)}<select id="f-with">${WITH.map(([k, l]) => `<option value="${k}" ${f.with === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>` : ''}
      ${st.photoData || (f.photo && !st.photoDrop) ? `<span class="meta ph"><button data-f="viewph">${st.photoData ? `<img src="${st.photoData}" alt="">` : ic('camera', 15)}<span>Foto</span></button><button data-f="rmph" aria-label="Hapus foto">${ic('x', 14, 'b')}</button></span>`
        : `<button class="meta" data-f="photo">${ic('camera', 15)}<span>Foto</span></button>`}`;
    $b('#f-w').onchange = e => { f.walletId = e.target.value; if (f.toWalletId === f.walletId) f.toWalletId = ''; drawDetail(); };
    const toSel = $b('#f-to'); if (toSel) toSel.onchange = e => { f.toWalletId = e.target.value; drawDetail(); };
    const fee = $b('#f-fee'); if (fee) fee.oninput = () => { f.fee = digits(fee.value); fee.value = fmtNum(f.fee); };
    $b('#f-date').onchange = e => { f.date = e.target.value || today(); drawDetail(); };
    const ws = $b('#f-with'); if (ws) ws.onchange = e => { f.with = e.target.value; st.withManual = true; drawDetail(); };
  }
  function drawHint() {
    const h = $b('#f-hint'), c = D.categories.find(x => x.id === f.categoryId);
    if (f.type === 'transfer' || sys) { h.innerHTML = ''; return; }
    if (st.why && c) h.innerHTML = `${itile(c.icon, c.color, 'xs')}<span><b>${esc(c.name)}</b> · otomatis dari ${st.why === 'riwayat' ? 'kebiasaanmu' : 'kata kunci'}</span>`;
    else if (!c && f.note.trim()) h.innerHTML = '<span>Kata baru — pilih kategori sekali, berikutnya otomatis</span>';
    else h.innerHTML = '';
  }
  // Baca catatan: isi nominal & tebak kategori/jenis tanpa mengganggu input yang sedang diketik.
  function think() {
    if (!st.amtManual) {
      const p = parseAmount(f.note);
      st.parsed = p;
      f.amount = p ? p.v : 0;
      const amt = $b('#f-amt'); amt.value = fmtNum(f.amount); fitAmt(amt);
    }
    if (!st.catManual && f.type !== 'transfer') {
      const g = smartGuess(f.note, f.type, !st.typeManual);
      const before = f.type;
      if (g) { f.type = g.type; f.categoryId = g.cat.id; st.why = g.why; }
      else { f.categoryId = ''; st.why = ''; }
      if (f.type !== before) drawType();
      drawCats();
    }
    if (!st.withManual && f.type !== 'transfer') { const w = guessWith(f.note); if (w !== f.with) { f.with = w; drawDetail(); } }
    drawHint();
  }
  el.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const k = b.dataset.f;
    if (k === 'payw') { f.walletId = b.dataset.v; if (f.toWalletId === f.walletId) f.toWalletId = ''; drawPay(); drawDetail(); return; }
    if (k === 'type') {
      if (f.type === b.dataset.v) return;
      f.type = b.dataset.v; st.typeManual = true; st.catManual = false; f.categoryId = '';
      $b('#f-note').placeholder = f.type === 'transfer' ? 'Catatan (opsional)' : 'Ketik: kopi 25rb, gojek ke kantor, gaji…';
      drawType(); drawDetail(); think();
    }
    else if (k === 'cat') { f.categoryId = b.dataset.v; st.catManual = true; st.why = ''; el.body.querySelectorAll('[data-f=cat]').forEach(x => x.classList.toggle('on', x === b)); drawHint(); }
    else if (k === 'all') { st.all = !st.all; drawCats(); }
    else if (k === 'photo') pickPhoto().then(d => { if (d) { st.photoData = d; drawDetail(); } });
    else if (k === 'viewph') viewPhoto(f.photo, st.photoData);
    else if (k === 'rmph') { st.photoData = ''; st.photoDrop = true; drawDetail(); }
    else if (k === 'newcat') openCatForm(null, f.type, c => { f.categoryId = c.id; st.catManual = true; st.why = ''; drawCats(); drawHint(); });
    else if (k === 'dup') {
      const n = Object.assign({}, f, { id:uid(), date:today(), createdAt:new Date().toISOString(), photo:'' });
      closeSheet(el); persist([['saveTx', n]], () => D.transactions.push(n), 'Transaksi diduplikat');
    }
    else if (k === 'del') {
      if (!await confirmBox('Hapus transaksi?', 'Saldo akun akan dihitung ulang.')) return;
      closeSheet(el); persist([['deleteTx', f.id]], () => D.transactions = D.transactions.filter(x => x.id !== f.id), 'Transaksi dihapus');
    }
  });
  function save() {
    if (!(f.amount > 0)) return toast('Masukkan nominal', true);
    if (!f.walletId) return toast('Pilih akun', true);
    // nominal yang diambil dari catatan dibuang dari teks catatan
    if (!st.amtManual && st.parsed && st.parsed.v === f.amount) f.note = f.note.replace(st.parsed.text, ' ').replace(/\s+/g, ' ').trim();
    if (f.type === 'transfer') {
      if (!f.toWalletId || f.toWalletId === f.walletId) return toast('Pilih akun tujuan', true);
      f.categoryId = '';
    } else {
      if (!f.categoryId) { const g = f.note && smartGuess(f.note, f.type, false); f.categoryId = (g ? g.cat : fallbackCat(f.type) || {}).id || ''; }
      if (!f.categoryId) return toast('Pilih kategori', true);
      f.toWalletId = ''; f.fee = 0;
    }
    f.updatedAt = new Date().toISOString();
    if (wGroup(wal(f.walletId)) === 'liquid') ls('lastWallet', f.walletId);
    const o = Object.assign({}, f), calls = [['saveTx', o]];
    if (f.type === 'transfer') o.with = '';
    // foto: unggah dulu (transaksi menyimpan id-nya); foto lama dihapus bila diganti/dibuang
    const oldPhoto = t && t.photo;
    if (st.photoData) { o.photo = uid(); PHOTOS[o.photo] = st.photoData; calls.unshift(['savePhoto', { id:o.photo, data:st.photoData }]); }
    else if (st.photoDrop) o.photo = '';
    if (oldPhoto && oldPhoto !== o.photo) calls.push(['deletePhoto', oldPhoto]);
    let r2 = null;
    if (preset.recur) { r2 = Object.assign({}, preset.recur, { next:addFreq(preset.recur.next, preset.recur.freq, anchorOf(preset.recur)) }); calls.push(['saveRecurring', r2]); }
    closeSheet(el);
    persist(calls, () => { upsertLocal(D.transactions, o); if (r2) upsertLocal(D.recurring, r2); }, edit ? 'Perubahan disimpan' : r2 ? 'Tagihan dibayar' : `Dicatat · ${o.type === 'transfer' ? 'Transfer' : cat(o.categoryId).name}`);
  }
  draw();
}

// Transfer antar akun dengan biaya admin opsional (dicatat sebagai pengeluaran "Biaya Transfer").
const FEES = [[0, 'Gratis'], [1000, '1rb'], [2500, '2,5rb'], [6500, '6,5rb']];
function openMove(fromId, toId) {
  const ws = activeWallets();
  if (ws.length < 2) { toast('Butuh minimal 2 akun', true); return openWalletForm(null, 'ewallet'); }
  const f = { from:wal(fromId) && !wal(fromId).archived ? fromId : (firstLiquid() || ws[0]).id, to:toId || '', amount:0, fee:0, note:'', date:today() };
  if (!f.to || f.to === f.from) f.to = (ws.find(w => w.id !== f.from && wGroup(w) === 'liquid') || ws.find(w => w.id !== f.from)).id;
  const el = openSheet({ title:'Pindah Saldo', right:'Pindahkan', onRight:save });
  const $b = q => el.body.querySelector(q);
  const picker = (key, sel, skip) => `<div class="wpick">${ws.filter(w => w.id !== skip).map(w => `<button class="wp ${w.id === sel ? 'on' : ''}" data-f="${key}" data-v="${w.id}">${wicon(w, 'xs')}<span><b>${esc(w.name)}</b><small>${money(balances()[w.id] || 0)}</small></span></button>`).join('')}</div>`;
  function draw() {
    el.body.innerHTML = `<div class="flabel">Dari</div>${picker('from', f.from)}
      <div class="center" style="margin:6px 0 -6px"><button class="hbtn" data-f="flip" aria-label="Tukar">${ic('swap', 18)}</button></div>
      <div class="flabel" style="margin-top:0">Ke</div>${picker('to', f.to, f.from)}
      <div class="amt-box"><small>Jumlah dipindah</small><div class="amt"><span>Rp</span><input id="m-amt" inputmode="numeric" placeholder="0" value="${fmtNum(f.amount)}" autocomplete="off"></div>
        <button class="chip" data-f="all" style="margin:8px auto 0">Pindahkan semua</button></div>
      <div class="flabel">Biaya admin <span style="opacity:.7">(opsional)</span></div>
      <div class="chips" style="margin-top:0">${FEES.map(([v, l]) => `<button class="chip ${f.fee === v ? 'on' : ''}" data-f="fee" data-v="${v}">${l}</button>`).join('')}</div>
      <div class="group mt">
        <div class="field"><label>Biaya lain</label><input id="m-fee" inputmode="numeric" placeholder="Rp0" value="${fmtNum(f.fee)}"></div>
        <div class="field"><label>Tanggal</label><input id="m-date" type="date" value="${f.date}"></div>
        <div class="field"><label>Catatan</label><input id="m-note" placeholder="Opsional" value="${esc(f.note)}" maxlength="200"></div>
      </div>
      <div id="m-prev"></div>`;
    const amt = $b('#m-amt'), fee = $b('#m-fee');
    amt.oninput = () => { f.amount = digits(amt.value); amt.value = fmtNum(f.amount); preview(); };
    fee.oninput = () => { f.fee = digits(fee.value); fee.value = fmtNum(f.fee); el.body.querySelectorAll('[data-f=fee]').forEach(x => x.classList.toggle('on', +x.dataset.v === f.fee)); preview(); };
    $b('#m-date').onchange = e => f.date = e.target.value || today();
    $b('#m-note').oninput = e => f.note = e.target.value;
    el.body.querySelectorAll('.wp.on').forEach(x => x.parentElement.scrollLeft = x.offsetLeft - x.parentElement.offsetLeft - 16);
    preview();
  }
  function preview() {
    const bal = balances(), a = wal(f.from), b = wal(f.to);
    const fa = bal[f.from] || 0, ta = bal[f.to] || 0, out = f.amount + f.fee;
    $b('#m-prev').innerHTML = !a || !b ? '' : `<div class="card pad mt mprev">
      <div class="mrow">${wicon(a, 'xs')}<span>${esc(a.name)}</span><b>${money(fa)} → <em class="${fa - out < 0 ? 'exp' : ''}">${money(fa - out)}</em></b></div>
      <div class="mrow">${wicon(b, 'xs')}<span>${esc(b.name)}</span><b>${money(ta)} → <em class="inc">${money(ta + f.amount)}</em></b></div>
      ${f.fee ? `<p class="hint" style="margin:8px 0 0">Biaya admin ${money(f.fee)} dicatat sebagai pengeluaran.</p>` : ''}</div>`;
  }
  el.body.addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const k = b.dataset.f;
    if (k === 'from') { f.from = b.dataset.v; if (f.to === f.from) f.to = ws.find(w => w.id !== f.from).id; draw(); }
    if (k === 'to') { f.to = b.dataset.v; draw(); }
    if (k === 'flip') { [f.from, f.to] = [f.to, f.from]; draw(); }
    if (k === 'fee') { f.fee = +b.dataset.v; draw(); }
    if (k === 'all') { f.amount = Math.max(0, (balances()[f.from] || 0) - f.fee); draw(); }
  });
  function save() {
    if (!(f.amount > 0)) return toast('Masukkan jumlah', true);
    if (!f.to || f.to === f.from) return toast('Pilih akun tujuan', true);
    const t = { id:uid(), type:'transfer', walletId:f.from, toWalletId:f.to, categoryId:'', amount:f.amount, fee:f.fee, refId:'',
      note:f.note.trim() || `Pindah saldo ke ${nm(wal(f.to))}`, date:f.date, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    closeSheet(el);
    persist([['saveTx', t]], () => D.transactions.push(t), `Saldo dipindah ke ${nm(wal(f.to))}`);
  }
  draw();
}

function openWallet(id) {
  const el = openSheet({ title:'Detail Akun', left:'Tutup', right:'Edit', onRight:() => openWalletForm(wal(id)) });
  el._refresh = () => {
    const w = wal(id); if (!w) return closeSheet(el);
    const g = wGroup(w), b = balances()[id] || 0;
    const L = sortTx(D.transactions.filter(t => t.walletId === id || t.toWalletId === id));
    let inc = 0, out = 0;
    L.filter(t => t.date.slice(0, 7) === thisMonth()).forEach(t => {
      if (t.type === 'income' || (t.type === 'transfer' && t.toWalletId === id)) inc += t.amount;
      else out += t.amount + (t.type === 'transfer' ? t.fee : 0);
    });
    let cells;
    if (g === 'invest') { const s = invStats(w); cells = [['Modal', money(s.modal), ''], ['Untung/Rugi', money(s.pl, true), s.pl >= 0 ? 'inc' : 'exp'], ['Return', pctTxt(s.pct), s.pl >= 0 ? 'inc' : 'exp']]; }
    else if (g === 'credit') cells = [['Tagihan', money(Math.max(0, -b)), 'exp'], ['Limit', w.limit ? money(w.limit) : '—', ''], ['Sisa limit', w.limit ? money(w.limit + Math.min(0, b)) : '—', 'inc']];
    else cells = [['Masuk bln ini', money(inc), 'inc'], ['Keluar bln ini', money(out), 'exp'], ['Saldo awal', money(w.initial), '']];
    let mid = '';
    if (!w.archived) {
      const acts = g === 'invest' ? [['invSetor', 'plus', 'Setor'], ['invVal', 'edit', 'Update Nilai'], ['invJual', 'sell', 'Jual']]
        : g === 'credit' ? [['wAdd', 'plus', 'Catat'], ['wPay', 'check', 'Bayar'], ['wAdj', 'refresh', 'Koreksi']]
        : [['wAdd', 'plus', 'Catat'], ['move', 'swap', 'Pindah'], ['wAdj', 'refresh', 'Koreksi']];
      mid = `<div class="wacts">${acts.map(a => `<button data-act="${a[0]}" data-id="${id}">${ic(a[1], 20)}${a[2]}</button>`).join('')}</div>`;
    }
    el.body.innerHTML = `
    <div class="wd" style="background:radial-gradient(120% 140% at 0% 0%,${w.color} 0%,${shade(w.color, .55)} 100%)">
      <div class="wd-h">${wicon(w)}<div><b>${esc(w.name)}</b><br><small>${wt(w).l}${w.sub ? ' · ' + esc(w.sub) : ''}${w.archived ? ' · Diarsipkan' : ''}</small></div></div>
      <div class="wd-b">${money(g === 'credit' ? Math.max(0, -b) : g === 'invest' ? invStats(w).value : b)}</div><small>${g === 'credit' ? 'Tagihan saat ini' : g === 'invest' ? 'Nilai sekarang' : 'Saldo saat ini'}</small>
    </div>
    ${mid}
    <div class="strip mt">${cells.map(c => `<div><small>${c[0]}</small><b class="${c[2]}">${c[1]}</b></div>`).join('')}</div>
    ${L.length ? groupedTx(L.slice(0, 150), { wallet:id }) : `<div class="mt">${empty('receipt', 'Belum ada transaksi')}</div>`}`;
  };
  el._refresh();
}

function openWalletForm(w, presetType) {
  const edit = !!w;
  const type0 = presetType && WTYPES[presetType] ? presetType : 'bank';
  const f = w ? Object.assign({}, w) : { id:uid(), name:'', type:type0, color:COLORS[D.wallets.length % COLORS.length], initial:0, limit:0, logo:'', sub:type0 === 'invest' ? 'Reksadana' : '',
    archived:false, order:D.wallets.length, createdAt:new Date().toISOString() };
  const el = openSheet({ title:edit ? 'Edit Akun' : 'Akun Baru', right:'Simpan', onRight:save });
  const draw = () => {
    const g = wt(f).g;
    const initLabel = g === 'credit' ? 'Tagihan awal' : g === 'invest' ? 'Modal / nilai awal' : 'Saldo awal';
    const initVal = g === 'credit' ? -f.initial : f.initial;
    el.body.innerHTML = `
    <div class="flabel">Jenis akun</div>
    <div class="cgrid">${Object.entries(WTYPES).map(([k, v]) => `<button class="cg ${f.type === k ? 'on' : ''}" data-f="type" data-v="${k}">${itile(v.i, f.type === k ? f.color : '#8C8F99', 'sm')}<span>${v.l}</span></button>`).join('')}</div>
    <div class="flabel">Informasi</div>
    <div class="group">
      <div class="field full"><input id="w-name" placeholder="${g === 'invest' ? 'Nama (mis. RDPU, Saham BBCA)' : g === 'credit' ? 'Nama (mis. BCA Card, SPayLater)' : 'Nama (mis. BCA, GoPay)'}" value="${esc(f.name)}" maxlength="60"></div>
      ${g === 'invest' ? selField('w-sub', 'Instrumen', INV_SUBS.map(s => `<option ${f.sub === s ? 'selected' : ''}>${s}</option>`).join('')) : ''}
      <div class="field"><label>${initLabel}</label><input id="w-init" inputmode="numeric" placeholder="Rp0" value="${fmtNum(Math.max(0, initVal))}"></div>
      ${g === 'credit' ? `<div class="field"><label>Limit kredit</label><input id="w-limit" inputmode="numeric" placeholder="Rp0" value="${fmtNum(f.limit)}"></div>` : ''}
    </div>
    <div class="flabel">Logo</div>${logoPicker(f.logo || '', itile(wt(f).i, f.color, 'sm'))}
    <div class="flabel">Warna</div>
    <div class="group"><div class="swatches">${COLORS.map(c => `<button class="sw ${f.color === c ? 'on' : ''}" style="background:${c}" data-f="color" data-v="${c}"></button>`).join('')}</div></div>
    ${edit ? `<div class="flabel">Lainnya</div><div class="group"><div class="field"><label>Arsipkan akun</label><span style="flex:1"></span><button class="toggle ${f.archived ? 'on' : ''}" data-f="arch"></button></div></div>
      <p class="hint">Akun yang diarsipkan disembunyikan, riwayatnya tetap tersimpan.</p>
      <button class="btn danger mt" data-f="del">${ic('trash', 17)}Hapus Akun</button>` : ''}`;
    el.body.querySelector('#w-name').oninput = e => f.name = e.target.value;
    const sub = el.body.querySelector('#w-sub'); if (sub) sub.onchange = e => f.sub = e.target.value;
    const init = el.body.querySelector('#w-init');
    init.oninput = () => { const v = digits(init.value); init.value = fmtNum(v); f.initial = g === 'credit' ? -v : v; };
    const lim = el.body.querySelector('#w-limit'); if (lim) lim.oninput = () => { f.limit = digits(lim.value); lim.value = fmtNum(f.limit); };
  };
  el.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    if (b.dataset.f === 'type') { const before = wt(f).g; f.type = b.dataset.v; if (wt(f).g !== before) { f.initial = 0; if (wt(f).g === 'invest' && !f.sub) f.sub = 'Reksadana'; } draw(); }
    if (b.dataset.f === 'color') { f.color = b.dataset.v; draw(); }
    if (b.dataset.f === 'logo') { f.logo = b.dataset.v; draw(); }
    if (b.dataset.f === 'upload') uploadLogo(f.name).then(k => { if (k) { f.logo = k; draw(); } });
    if (b.dataset.f === 'arch') { f.archived = !f.archived; b.classList.toggle('on', f.archived); }
    if (b.dataset.f === 'del') {
      if (D.goals.some(g => g.walletId === f.id) || D.recurring.some(r => r.walletId === f.id || r.toWalletId === f.id))
        return toast('Akun dipakai goal / transaksi berulang', true);
      if (D.transactions.some(t => t.walletId === f.id || t.toWalletId === f.id)) {
        if (await confirmBox('Akun punya transaksi', 'Akun ini tidak bisa dihapus karena memiliki riwayat. Arsipkan saja?', 'Arsipkan', false)) {
          const o = Object.assign({}, w, { archived:true }); closeSheet(el);
          persist([['saveWallet', o]], () => upsertLocal(D.wallets, o), 'Akun diarsipkan');
        }
        return;
      }
      if (!await confirmBox('Hapus akun?', `"${esc(f.name)}" akan dihapus permanen.`)) return;
      closeSheet(el); persist([['deleteWallet', f.id]], () => D.wallets = D.wallets.filter(x => x.id !== f.id), 'Akun dihapus');
    }
  });
  function save() {
    f.name = f.name.trim();
    if (!f.name) return toast('Isi nama akun', true);
    if (wt(f).g !== 'credit') f.limit = 0;
    if (wt(f).g !== 'invest') f.sub = '';
    const o = Object.assign({}, f);
    closeSheet(el);
    persist([['saveWallet', o]], () => upsertLocal(D.wallets, o), edit ? 'Akun diperbarui' : 'Akun ditambahkan');
  }
  draw();
}

// Koreksi saldo (akun biasa) atau update nilai pasar (investasi).
function openAdjust(id, isVal) {
  const w = wal(id), g = wGroup(w), cur = balances()[id] || 0, credit = g === 'credit';
  let target = credit ? -cur : cur;
  const el = openSheet({ title:isVal ? 'Update Nilai' : 'Koreksi Saldo', right:'Simpan', onRight:save });
  el.body.innerHTML = `<div class="amt-box"><small>${isVal ? 'Nilai pasar saat ini' : credit ? 'Tagihan sebenarnya' : 'Saldo sebenarnya'}</small>
      <div class="amt"><span>Rp</span><input id="a-val" inputmode="numeric" placeholder="0" value="${fmtNum(target)}"></div></div>
    <div class="group mt"><div class="field"><label>${isVal ? 'Nilai tercatat' : 'Tercatat'}</label><span style="flex:1;text-align:right;color:var(--sub)">${money(credit ? -cur : cur)}</span></div></div>
    <p class="hint">${isVal ? 'Selisih dicatat sebagai "Perubahan Nilai" (untung/rugi), bukan pemasukan/pengeluaran.' : 'Selisih dicatat sebagai "Penyesuaian Saldo" dan tidak masuk laporan.'}</p>`;
  const inp = el.body.querySelector('#a-val');
  inp.oninput = () => { target = digits(inp.value); inp.value = fmtNum(target); };
  function save() {
    const diff = Math.round(credit ? -target : target) - cur;
    if (!diff) { closeSheet(el); return toast(isVal ? 'Nilai tidak berubah' : 'Saldo sudah sesuai'); }
    const o = { id:uid(), type:diff > 0 ? 'income' : 'expense', amount:Math.abs(diff), fee:0, walletId:id, toWalletId:'', categoryId:isVal ? '__val' : '__adj', refId:'',
      note:isVal ? 'Update nilai' : 'Koreksi saldo', date:today(), createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    closeSheet(el);
    persist([['saveTx', o]], () => D.transactions.push(o), isVal ? 'Nilai diperbarui' : 'Saldo dikoreksi');
  }
}

/* ========================= Berulang, tagihan & goals ========================= */
function openRecurForm(r, autoPreset, dateHint) {
  const edit = !!r;
  const act = activeWallets();
  if (!act.length) return toast('Buat akun terlebih dahulu', true);
  const f = r ? Object.assign({}, r) : { id:uid(), name:'', type:'expense', walletId:(firstLiquid() || act[0]).id, toWalletId:'', categoryId:'', amount:0, freq:'monthly',
    start:dateHint || today(), next:dateHint || today(), auto:!!autoPreset, active:true, note:'', logo:'' };
  const el = openSheet({ title:edit ? 'Edit' : f.auto ? 'Transaksi Berulang' : 'Tagihan Baru', right:'Simpan', onRight:save });
  let catManual = edit;
  const draw = () => {
    const T = f.type;
    el.body.innerHTML = `${segHtml('type', [['expense', 'Pengeluaran'], ['income', 'Pemasukan'], ['transfer', 'Transfer']], T)}
    <div class="amt-box ${T === 'income' ? 'inc' : T === 'expense' ? 'exp' : ''}"><small>Nominal</small><div class="amt"><span>Rp</span><input id="r-amt" inputmode="numeric" placeholder="0" value="${fmtNum(f.amount)}"></div></div>
    <div class="flabel">Detail</div>
    <div class="group">
      <div class="field full"><input id="r-name" placeholder="Nama (mis. Listrik PLN, Netflix, Gaji)" value="${esc(f.name)}" maxlength="60"></div>
      ${T !== 'transfer' ? selField('r-cat', 'Kategori', `<option value="">Pilih</option>${cats(T).map(c => `<option value="${c.id}" ${c.id === f.categoryId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}`) : ''}
      ${selField('r-w', T === 'transfer' ? 'Dari' : 'Akun', walletOptions(f.walletId))}
      ${T === 'transfer' ? selField('r-to', 'Ke', `<option value="">Pilih akun</option>${walletOptions(f.toWalletId, f.walletId)}`) : ''}
    </div>
    <div class="flabel">Logo ${f.auto ? '' : 'tagihan / langganan'}</div>${logoPicker(f.logo || '', itile(recCat(f).icon, recCat(f).color, 'sm'))}
    <div class="flabel">Jadwal</div>
    ${segHtml('freq', Object.entries(FREQ), f.freq)}
    <div class="group mt">
      <div class="field"><label>${f.auto ? (edit ? 'Berikutnya' : 'Mulai') : (edit ? 'Jatuh tempo berikutnya' : 'Tanggal jatuh tempo')}</label><input id="r-next" type="date" value="${f.next}"></div>
      <div class="field"><label>Catat otomatis</label><span style="flex:1"></span><button class="toggle ${f.auto ? 'on' : ''}" data-f="auto"></button></div>
      ${edit ? `<div class="field"><label>Aktif</label><span style="flex:1"></span><button class="toggle ${f.active ? 'on' : ''}" data-f="active"></button></div>` : ''}
    </div>
    <p class="hint">${f.auto ? 'Dicatat otomatis saat jatuh tempo, tanpa perlu dibuka satu per satu.' : 'Jadi pengingat tagihan. Ketuk Bayar saat sudah dibayar.'}</p>
    ${edit ? `<div class="btns">${f.auto ? '<span></span>' : `<button class="btn" data-f="skip">${ic('skip', 17)}Lewati</button>`}<button class="btn danger" data-f="del">${ic('trash', 17)}Hapus</button></div>` : ''}`;
    const amt = el.body.querySelector('#r-amt'); amt.oninput = () => { f.amount = digits(amt.value); amt.value = fmtNum(f.amount); };
    const c = el.body.querySelector('#r-cat');
    el.body.querySelector('#r-name').oninput = e => {
      f.name = e.target.value;
      if (catManual || !c) return;
      const g = smartGuess(f.name, T, false);
      f.categoryId = g ? g.cat.id : ''; c.value = f.categoryId;
    };
    if (c) c.onchange = e => { f.categoryId = e.target.value; catManual = !!f.categoryId; if (!f.name) { f.name = cat(f.categoryId).name; el.body.querySelector('#r-name').value = f.name; } };
    el.body.querySelector('#r-w').onchange = e => { f.walletId = e.target.value; if (T === 'transfer') draw(); };
    const to = el.body.querySelector('#r-to'); if (to) to.onchange = e => f.toWalletId = e.target.value;
    el.body.querySelector('#r-next').onchange = e => { f.next = e.target.value || today(); if (!edit) f.start = f.next; };
  };
  el.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const k = b.dataset.f;
    if (k === 'type') { f.type = b.dataset.v; f.categoryId = ''; catManual = false; draw(); }
    if (k === 'freq') { f.freq = b.dataset.v; draw(); }
    if (k === 'logo') { f.logo = b.dataset.v; draw(); }
    if (k === 'upload') uploadLogo(f.name).then(key => { if (key) { f.logo = key; draw(); } });
    if (k === 'auto') { f.auto = !f.auto; draw(); }
    if (k === 'active') { f.active = !f.active; b.classList.toggle('on', f.active); }
    if (k === 'skip') {
      const o = Object.assign({}, r, { next:addFreq(r.next, r.freq, anchorOf(r)) }); closeSheet(el);
      persist([['saveRecurring', o]], () => upsertLocal(D.recurring, o), 'Dilewati, jatuh tempo berikutnya ' + dateShort(o.next));
    }
    if (k === 'del') {
      if (!await confirmBox('Hapus?', 'Transaksi yang sudah tercatat tetap tersimpan.')) return;
      closeSheet(el); persist([['deleteRecurring', f.id]], () => D.recurring = D.recurring.filter(x => x.id !== f.id), 'Dihapus');
    }
  });
  function save() {
    f.name = f.name.trim();
    if (!(f.amount > 0)) return toast('Masukkan nominal', true);
    if (f.type !== 'transfer' && !f.categoryId) return toast('Pilih kategori', true);
    if (f.type === 'transfer' && (!f.toWalletId || f.toWalletId === f.walletId)) return toast('Pilih akun tujuan', true);
    if (!f.name) f.name = f.type === 'transfer' ? 'Transfer rutin' : cat(f.categoryId).name;
    if (f.type === 'transfer') f.categoryId = ''; else f.toWalletId = '';
    const o = Object.assign({}, f);
    closeSheet(el);
    persist([['saveRecurring', o]], () => upsertLocal(D.recurring, o), edit ? 'Disimpan' : o.auto ? 'Transaksi berulang dibuat' : 'Tagihan ditambahkan');
  }
  draw();
}
function payBill(r) {
  if (!r) return;
  openTxForm(null, { type:r.type, amount:r.amount, walletId:r.walletId, toWalletId:r.toWalletId, categoryId:r.categoryId, note:r.name, refId:r.id, recur:r });
}
function openGoalForm(g) {
  const edit = !!g;
  const f = g ? Object.assign({}, g) : { id:uid(), name:'', target:0, walletId:'', due:'', color:'#22C55E', icon:'flag', createdAt:new Date().toISOString() };
  let newWallet = !edit, init = 0;
  const el = openSheet({ title:edit ? 'Edit Goal' : 'Goal Baru', right:'Simpan', onRight:save });
  const draw = () => {
    const pool = D.wallets.filter(w => wGroup(w) === 'liquid' && !w.archived && (!D.goals.some(x => x.walletId === w.id) || w.id === f.walletId));
    el.body.innerHTML = `<div class="center" style="margin:6px 0">${itile(f.icon, f.color, 'lg')}</div>
    <div class="amt-box"><small>Target</small><div class="amt"><span>Rp</span><input id="g-amt" inputmode="numeric" placeholder="0" value="${fmtNum(f.target)}"></div></div>
    <div class="flabel">Detail</div>
    <div class="group">
      <div class="field full"><input id="g-name" placeholder="Nama (mis. Liburan Jepang, Dana Darurat)" value="${esc(f.name)}" maxlength="60"></div>
      <div class="field"><label>Target tanggal</label><input id="g-due" type="date" value="${f.due}"></div>
    </div>
    <div class="flabel">Kantong tabungan</div>
    <div class="group">
      ${edit ? '' : `<div class="field"><label>Buat kantong baru</label><span style="flex:1"></span><button class="toggle ${newWallet ? 'on' : ''}" data-f="nw"></button></div>`}
      ${newWallet ? `<div class="field"><label>Saldo awal</label><input id="g-init" inputmode="numeric" placeholder="Rp0" value="${fmtNum(init)}"></div>`
        : selField('g-w', 'Kantong', `<option value="">Pilih akun</option>${pool.map(w => `<option value="${w.id}" ${w.id === f.walletId ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}`)}
    </div>
    <div class="flabel">Ikon & warna</div>
    <div class="group"><div class="igrid">${GOAL_ICONS.map(i => `<button class="${f.icon === i ? 'on' : ''}" data-f="icon" data-v="${i}">${art(i, 30)}</button>`).join('')}</div>
      <div class="swatches" style="padding-top:0">${COLORS.map(c => `<button class="sw ${f.color === c ? 'on' : ''}" style="background:${c}" data-f="color" data-v="${c}"></button>`).join('')}</div></div>
    ${edit ? `<button class="btn danger mt" data-f="del">${ic('trash', 17)}Hapus Goal</button><p class="hint">Kantong tabungan dan saldonya tidak ikut dihapus.</p>` : ''}`;
    const amt = el.body.querySelector('#g-amt'); amt.oninput = () => { f.target = digits(amt.value); amt.value = fmtNum(f.target); };
    el.body.querySelector('#g-name').oninput = e => f.name = e.target.value;
    el.body.querySelector('#g-due').onchange = e => f.due = e.target.value;
    const gi = el.body.querySelector('#g-init'); if (gi) gi.oninput = () => { init = digits(gi.value); gi.value = fmtNum(init); };
    const gw = el.body.querySelector('#g-w'); if (gw) gw.onchange = e => f.walletId = e.target.value;
  };
  el.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const k = b.dataset.f;
    if (k === 'nw') { newWallet = !newWallet; draw(); }
    if (k === 'icon') { f.icon = b.dataset.v; draw(); }
    if (k === 'color') { f.color = b.dataset.v; draw(); }
    if (k === 'del') {
      if (!await confirmBox('Hapus goal?', 'Kantong tabungan tetap ada.')) return;
      closeSheet(el); persist([['deleteGoal', f.id]], () => D.goals = D.goals.filter(x => x.id !== f.id), 'Goal dihapus');
    }
  });
  function save() {
    f.name = f.name.trim();
    if (!f.name) return toast('Isi nama goal', true);
    if (!(f.target > 0)) return toast('Masukkan target', true);
    const calls = []; let w = null;
    if (newWallet) {
      w = { id:uid(), name:f.name, type:'saving', color:f.color, initial:init, limit:0, sub:'', archived:false, order:D.wallets.length, createdAt:new Date().toISOString() };
      f.walletId = w.id; calls.push(['saveWallet', w]);
    }
    if (!f.walletId) return toast('Pilih kantong tabungan', true);
    const o = Object.assign({}, f); calls.push(['saveGoal', o]);
    closeSheet(el);
    persist(calls, () => { if (w) D.wallets.push(w); upsertLocal(D.goals, o); }, edit ? 'Goal diperbarui' : 'Goal dibuat');
  }
  draw();
}
function openNameForm() {
  let v = D.settings.userName || '';
  const el = openSheet({ title:'Nama', right:'Simpan', onRight:save });
  el.body.innerHTML = `<div class="group mt"><div class="field full"><input id="n-name" placeholder="Nama panggilan" value="${esc(v)}" maxlength="40" enterkeyhint="done"></div></div>
    <p class="hint">Ditampilkan di sapaan beranda.</p>`;
  const inp = el.body.querySelector('#n-name'); inp.oninput = () => v = inp.value; setTimeout(() => inp.focus(), 360);
  function save() { v = v.trim(); closeSheet(el); persist([['saveSetting', 'userName', v]], () => D.settings.userName = v, 'Nama disimpan'); }
}

/* ========================= Utang & piutang ========================= */
function openDebt(id) {
  const el = openSheet({ title:'Detail', left:'Tutup', right:'Edit', onRight:() => openDebtForm(D.debts.find(d => d.id === id)) });
  el._refresh = () => {
    const d = D.debts.find(x => x.id === id); if (!d) return closeSheet(el);
    const s = debtStats(d), p = d.amount ? s.paid / d.amount : 0, owe = d.kind === 'hutang';
    el.body.innerHTML = `<div class="wd" style="background:${owe ? 'radial-gradient(120% 140% at 0% 0%,#E5484D,#5C1A22)' : 'radial-gradient(120% 140% at 0% 0%,#16A34A,#0B3D22)'}">
      <div class="wd-h"><span class="tile" style="background:rgba(255,255,255,.18);font-weight:600">${esc(initials(d.name))}</span><div><b>${esc(d.name)}</b><br><small>${owe ? 'Saya berutang' : 'Berutang ke saya'}${d.due ? ' · jatuh tempo ' + dateShort(d.due) : ''}</small></div></div>
      <div class="wd-b">${s.done ? 'Lunas' : money(s.left)}</div><small>${s.done ? 'Sudah dibayar penuh' : 'Sisa dari ' + money(d.amount)}</small>
      <div class="prog" style="margin-top:12px;background:rgba(255,255,255,.25);position:relative"><i style="width:${Math.min(p, 1) * 100}%;background:#fff"></i></div></div>
    ${d.note ? `<p class="hint">${esc(d.note)}</p>` : ''}
    ${s.done ? '' : `<button class="btn primary mt" data-f="pay">${ic('check', 18, 'b')}${owe ? 'Bayar Utang' : 'Terima Pembayaran'}</button>`}
    <div class="flabel">Riwayat (${s.L.length})</div>
    ${s.L.length ? `<div class="stack">${s.L.map(t => txRow(t, { date:true })).join('')}</div>` : empty('receipt', 'Belum ada pembayaran')}
    <button class="btn danger mt" data-f="del">${ic('trash', 17)}Hapus Catatan</button>`;
  };
  el.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const d = D.debts.find(x => x.id === id);
    if (b.dataset.f === 'pay') openDebtPay(d);
    if (b.dataset.f === 'del') {
      const n = debtStats(d).L.length;
      if (!await confirmBox('Hapus catatan?', n ? `Catatan beserta ${n} transaksi terkait akan dihapus dan saldo dihitung ulang.` : 'Catatan ini akan dihapus.')) return;
      closeSheet(el);
      persist([['deleteDebt', id]], () => { D.debts = D.debts.filter(x => x.id !== id); D.transactions = D.transactions.filter(t => t.refId !== id); }, 'Catatan dihapus');
    }
  });
  el._refresh();
}

    el.body.innerHTML = `${edit ? '' : segHtml('kind', [['hutang', 'Saya berutang'], ['piutang', 'Orang berutang']], f.kind)}

    <div class="flabel">Detail</div>
    <div class="group">
      <div class="field full"><input id="d-name" placeholder="${f.kind === 'hutang' ? 'Berutang ke siapa?' : 'Siapa yang berutang?'}" value="${esc(f.name)}" maxlength="60"></div>
      <div class="field"><label>Jatuh tempo</label><input id="d-due" type="date" value="${f.due}"></div>
      <div class="field"><label>Catatan</label><input id="d-note" placeholder="Opsional" value="${esc(f.note)}" maxlength="200"></div>

function applyTheme() {

async function reload(quiet) {

function pinPad() {
  return `<div class="pdots">${'<i></i>'.repeat(4)}</div><div class="pmsg"></div><div class="pkeys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, 'del']
    .map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k === 'del' ? ic('del', 26) : k}</button>`).join('')}</div>`;
}
function bindPinPad(root, onDone) {
  let v = '', busy = false;
  const dots = root.querySelectorAll('.pdots i'), msg = root.querySelector('.pmsg'), box = root.querySelector('.pdots');
  const upd = () => dots.forEach((d, i) => d.classList.toggle('on', i < v.length));
  const fail = m => { v = ''; upd(); busy = false; msg.textContent = m || ''; box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 400); };
  root.querySelector('.pkeys').addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b || busy) return;
    if (b.dataset.k === 'del') v = v.slice(0, -1); else if (v.length < 4) v += b.dataset.k;
    msg.textContent = ''; upd();
    if (v.length === 4) { busy = true; const val = v; setTimeout(() => onDone(val, fail, m => msg.textContent = m), 120); }
  });
}
function askPin(title) {
  return new Promise(res => {
    let done = false;
    const el = openSheet({ title, body:`<div class="pinsheet">${pinPad()}</div>`, onClose:() => { if (!done) res(null); } });
    bindPinPad(el, v => { done = true; closeSheet(el); res(v); });
  });
}
async function pinSetup() {
  let old = '';
  if (D.hasPin) {
    const c = await actionSheet('Kunci PIN', [['change', 'Ubah PIN'], ['off', 'Nonaktifkan PIN', true]]);
    if (!c) return;
    old = await askPin('PIN Saat Ini'); if (!old) return;
    if (c === 'off') {
      try { await api('setPin', old, ''); D.hasPin = false; saveCache(); render(); toast('PIN dinonaktifkan'); } catch (e) { toast(e.message, true); }
      return;
    }
  }
  const a = await askPin('PIN Baru (4 angka)'); if (!a) return;
  const b = await askPin('Ulangi PIN Baru'); if (!b) return;
  if (a !== b) return toast('PIN tidak cocok', true);
  try { await api('setPin', old, a); D.hasPin = true; saveCache(); render(); toast('PIN diaktifkan'); } catch (e) { toast(e.message, true); }
}
function showLock(first) {
  if ($('#lock')) return;
  const el = document.createElement('div');
  el.id = 'lock';
  el.innerHTML = `<div class="lk-in"><div class="applogo">${ic('wallet', 30)}</div><div class="lk-t">Masukkan PIN</div>${pinPad()}</div>`;
  document.body.appendChild(el);
  bindPinPad(el, async (pin, fail, note) => {
    note('Memeriksa…');
    try {
      setData(await api('unlock', pin));
      render();
      if (first) hideSplash();
      el.classList.add('out'); setTimeout(() => el.remove(), 260);
    } catch (e) { fail(e.message || 'PIN salah'); }
  });
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (D.hasPin && hiddenAt && Date.now() - hiddenAt > 60000) showLock(false);
});

  if (!db) db = demo();
  // data demo lama: tambahkan kategori yang belum ada
  DEF.forEach((c, i) => { if (!db.categories.some(x => x.type === c[0] && x.name === c[1])) db.categories.push({ id:'c' + i, name:c[1], type:c[0], icon:c[2], color:c[3], order:i, group:c[4] }); });
  db.photos = db.photos || {};
  const save = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) {} };
  const up = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); return o; };
  const all = () => JSON.parse(JSON.stringify({ wallets:db.wallets, categories:db.categories, transactions:db.transactions, budgets:db.budgets, debts:db.debts,
    recurring:db.recurring, goals:db.goals, logos:db.logos || [], settings:db.settings, hasPin:!!db.pin, dbUrl:'#' }));
  function runRecurring() {
    db.recurring.filter(r => r.auto && r.active && r.next <= today()).forEach(r => {
      for (let i = 0; i < 60 && r.next <= today(); i++) {
        db.transactions.push({ id:uid(), date:r.next, type:r.type, walletId:r.walletId, toWalletId:r.toWalletId, categoryId:r.categoryId, amount:r.amount, fee:0, note:r.note || r.name, refId:r.id, createdAt:new Date().toISOString() });
        r.next = addFreq(r.next, r.freq, anchorOf(r));
      }
    });
  }
  const F = {
    boot:() => { runRecurring(); return { hasPin:!!db.pin, data:db.pin ? null : all() }; },
    unlock:p => { if (p !== db.pin) throw new Error('PIN salah'); return Object.assign(all(), { token:'mock' }); },
    getAll:all,
    setPin:(o, n) => { if (db.pin && o !== db.pin) throw new Error('PIN lama salah'); db.pin = n || ''; return n ? { hasPin:true, token:'mock' } : { hasPin:false }; },
    saveWallet:w => up(db.wallets, w),
    deleteWallet:id => { if (db.transactions.some(t => t.walletId === id || t.toWalletId === id)) throw new Error('Akun masih punya transaksi'); db.wallets = db.wallets.filter(x => x.id !== id); return true; },
    saveCategory:c => up(db.categories, c),
    deleteCategory:id => { db.categories = db.categories.filter(x => x.id !== id); db.budgets = db.budgets.filter(x => x.categoryId !== id); return true; },
    saveTx:t => up(db.transactions, t),
    deleteTx:id => { db.transactions = db.transactions.filter(x => x.id !== id); return true; },
    saveBudget:b => { db.budgets = db.budgets.filter(x => x.categoryId !== b.categoryId || x.id === b.id); return up(db.budgets, b); },
    deleteBudget:id => { db.budgets = db.budgets.filter(x => x.id !== id); return true; },
    saveDebt:d => up(db.debts, d),
    deleteDebt:id => { db.debts = db.debts.filter(x => x.id !== id); db.transactions = db.transactions.filter(t => t.refId !== id); return true; },
    saveRecurring:r => up(db.recurring, r),
    deleteRecurring:id => { db.recurring = db.recurring.filter(x => x.id !== id); return true; },
    saveGoal:g => up(db.goals, g),
    deleteGoal:id => { db.goals = db.goals.filter(x => x.id !== id); return true; },
    saveSetting:(k, v) => { db.settings[k] = v; return true; },
    saveLogo:l => { db.logos = db.logos || []; up(db.logos, l); return { id:l.id }; },
    deleteLogo:id => { db.logos = (db.logos || []).filter(x => x.id !== id); return true; },
    savePhoto:ph => { db.photos[ph.id] = ph.data; return { id:ph.id }; },
    getPhoto:id => db.photos[id] || '',
    deletePhoto:id => { delete db.photos[id]; return true; }
  };
  return { call:(fn, args) => new Promise((res, rej) => setTimeout(() => { try { const r = F[fn](...JSON.parse(JSON.stringify(args))); save(); res(r); } catch (e) { rej(e); } }, 150)) };
})();

/* ========================= Boot ========================= */
// Banner peringatan Google di halaman luar Apps Script bisa membuat iframe lebih lebar dari layar HP;
// batasi tampilan ke lebar layar fisik agar tidak ada yang terpotong di kanan.
function fitScreen() {
  if (window.self === window.top || !window.matchMedia('(pointer:coarse)').matches) return;
  const ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const land = Math.abs(window.orientation || 0) === 90;
  const sw = ios ? (land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height)) : screen.width;
  const extra = window.innerWidth - sw;
  if (extra > 1 && extra < 120) document.documentElement.style.setProperty('--gx', Math.ceil(extra) + 'px');
  else document.documentElement.style.removeProperty('--gx');
}
// Aplikasi di Layar Utama iOS kadang melaporkan tinggi layar lebih pendek (navbar melayang, ada ruang kosong di bawah).
function fitPWA() {
  if (!(navigator.standalone || window.matchMedia('(display-mode: standalone)').matches)) return;
  const land = Math.abs(window.orientation || 0) === 90;
  const h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
  document.documentElement.style.setProperty('--appH', Math.max(h, window.innerHeight) + 'px');
  document.documentElement.classList.add('pwa');
}
fitPWA();
fitScreen();
window.addEventListener('resize', () => { fitScreen(); fitPWA(); });
window.addEventListener('orientationchange', () => setTimeout(fitScreen, 300));
function hideSplash() { const s = $('#splash'); if (!s) return; s.classList.add('out'); setTimeout(() => s.remove(), 300); }
async function start() {
  applyTheme(); drawNav();
  $('#sp-logo').innerHTML = ic('wallet', 30);
  const cached = IS_LIVE() ? readCache() : null;
  if (cached) { setData(cached); render(); hideSplash(); }
  try {
    const r = await api('boot');
    if (r.hasPin) { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} D.hasPin = true; showLock(true); return; }
    if (cached && mutated) return reload(true); // ada perubahan selama memuat: ambil ulang setelah tersimpan
    const sc = $('#scroll').scrollTop;
    setData(r.data); saveCache(); render(); $('#scroll').scrollTop = sc; hideSplash();
  } catch (e) {
    if (cached) return toast('Offline · menampilkan data terakhir', true);
    $('#sp-msg').innerHTML = `${esc(e.message || 'Gagal memuat')}<br><button class="btn" style="margin-top:12px" onclick="location.reload()">Coba lagi</button>`;
    const sp = document.querySelector('.spin'); if (sp) sp.remove();
  }
}
start();
