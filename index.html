<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DompetKu">
<meta name="theme-color" content="#0C0D10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>DompetKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --card2:#ECEEF1; --card3:#E2E5EA; --text:#111318; --sub:#6B7080; --mute:#A3A7B2;
  --line:rgba(17,19,24,.07); --accent:#0E9384; --inc:#16A34A; --exp:#E5484D; --warn:#E08A00;
  --nav:rgba(255,255,255,.86); --shadow:0 1px 2px rgba(17,19,24,.04),0 6px 20px -8px rgba(17,19,24,.10);
  --hero:radial-gradient(120% 130% at 0% 0%,#0B78C2 0%,rgba(11,120,194,0) 58%),radial-gradient(110% 130% at 100% 0%,#0E9F7E 0%,rgba(14,159,126,0) 58%),linear-gradient(180deg,#0B4664 0%,#06202D 100%);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0C0D10; --card:#16171B; --card2:#1F2025; --card3:#2A2B31; --text:#F2F3F5; --sub:#8C8F99; --mute:#55585F;
  --line:rgba(255,255,255,.06); --accent:#2CC4B0; --inc:#34D27B; --exp:#F05A66; --warn:#F5A524;
  --nav:rgba(30,31,36,.82); --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  html:not([data-theme=light]){
    --bg:#0C0D10; --card:#16171B; --card2:#1F2025; --card3:#2A2B31; --text:#F2F3F5; --sub:#8C8F99; --mute:#55585F;
    --line:rgba(255,255,255,.06); --accent:#2CC4B0; --inc:#34D27B; --exp:#F05A66; --warn:#F5A524;
    --nav:rgba(30,31,36,.82); --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);height:100%;overflow:hidden}
/* Apps Script menampilkan halaman di dalam iframe; di iOS iframe melebar mengikuti isi.
   Semua isi ditaruh di satu kontainer scroll yang fixed agar lebar tidak pernah melebihi layar. */
body{position:fixed;inset:0;width:100%;font:14.5px/1.35 Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html.pwa,html.pwa body{height:var(--appH)}
html.pwa body{bottom:auto}
#scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body.locked #scroll{overflow-y:hidden}
/* --gx: kelebihan lebar iframe dibanding layar HP (banner Google). Dipakai sebagai margin aman kiri-kanan
   agar isi tetap utuh baik saat halaman luar bergeser (keyboard iOS) maupun tidak. */
:root{--gx:0px;--px:calc(16px + var(--gx))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;color:inherit;font-size:16px}
b,.num{font-variant-numeric:tabular-nums}
.inc{color:var(--inc)} .exp{color:var(--exp)}

/* ikon */
.i{display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i .f{fill:currentColor;opacity:.22;stroke:none}
.i .s{fill:currentColor;stroke:none}
.i.b{stroke-width:2.2}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0}
.tile .f{opacity:.38}
.tile.sm{width:36px;height:36px;border-radius:11px}
.tile.lg{width:50px;height:50px;border-radius:16px}
.tile.ic{border-radius:50%}
.logo{width:46px;height:46px;flex-shrink:0;display:block;object-fit:contain}
.logo.sm{width:38px;height:38px}.logo.lg{width:60px;height:60px}.logo.xs{width:32px;height:32px}
.logo.mini{width:16px;height:16px}
.logo.mn,.tile.mn{width:18px;height:18px}
.lgrid .up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card2);color:var(--sub)}
.lgrid .up small{font-size:10px}
.cal{padding:12px 8px 8px}
.cw,.c7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cw span{text-align:center;font-size:11.5px;color:var(--sub);padding-bottom:6px}
.cd{border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;gap:4px;min-width:0;min-height:50px}
.cd .cn{font-size:13.5px;font-weight:500;min-width:24px;height:22px;line-height:22px;text-align:center;border-radius:99px}
.cd .ce{display:flex;align-items:center;justify-content:center;gap:1px;min-height:18px}
.cd .ce i{display:block}
.cd .ce i.paid{opacity:.4}
.cd .ce em{font-style:normal;font-size:9.5px;color:var(--sub);margin-left:1px}
.cd.today .cn{background:var(--text);color:var(--bg)}
.cd.sel{background:var(--card3)}
.cd.late .cn{color:var(--exp)}
.cd.today.late .cn{color:var(--bg);background:var(--exp)}
.due.paid{background:rgba(52,210,123,.15);color:var(--inc)}
.due.auto{background:rgba(44,196,176,.14);color:var(--accent)}
.tile.xs{width:30px;height:30px}
.art{display:block;flex-shrink:0;overflow:visible}

/* header */
#hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:var(--sat)}
.hd{max-width:calc(520px + 2 * var(--gx));margin:0 auto;display:flex;align-items:center;gap:10px;padding:6px var(--px);min-height:52px}
.hd h1{flex:1;text-align:center;font-size:19px;font-weight:600;letter-spacing:-.01em}
.hside{width:40px;display:flex;justify-content:center;flex-shrink:0}
.hbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--card)}
.hbtn.plain{background:none}
.hbtn.spinning .i{animation:rot .8s linear infinite}
.greet{flex:1;min-width:0}
.greet small{display:block;font-size:12.5px;color:var(--sub)}
.greet b{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,#0B78C2,#0E9F7E);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px;flex-shrink:0}

#app{max-width:calc(520px + 2 * var(--gx));margin:0 auto;padding:4px var(--px) calc(104px + var(--sab))}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* chip periode & segmen */
.periods{display:flex;gap:2px;margin:0 0 14px}
.menu::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.periods button{flex:1 1 0;min-width:0;padding:7px 0;border-radius:99px;font-size:13.5px;font-weight:500;color:var(--sub);text-align:center}
.periods button.on{background:var(--text);color:var(--bg)}
.seg{display:flex;background:var(--card);border-radius:99px;padding:4px;gap:2px}
.seg button{flex:1;text-align:center;font-size:13.5px;font-weight:500;padding:7px 6px;border-radius:99px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card3);color:var(--text)}
.seg.inline{display:inline-flex;margin:0 auto}
.center{display:flex;justify-content:center}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:16px;padding:5px}
.tog button{padding:11px;border-radius:12px;text-align:center;font-weight:500;color:var(--sub);border:1px solid transparent}
.tog button.on.exp{color:var(--exp);background:rgba(240,90,102,.12);border-color:rgba(240,90,102,.45)}
.tog button.on.inc{color:var(--inc);background:rgba(52,210,123,.12);border-color:rgba(52,210,123,.45)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 14px}
.pnav b{font-size:17px;font-weight:600}
.pnav button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:16px 12px 12px;background:var(--hero);color:#fff;text-align:center}
.hero:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.hero-cap{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;opacity:.85}
.hero-cap .i{opacity:.85}
.hero-amt{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:12.5px;opacity:.65}
.hchip{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.glass{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:left}
.gl{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:9px 11px;min-width:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gl-h{display:flex;align-items:center;gap:7px;font-size:12.5px;opacity:.85}
.gl-h i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.gl b{display:block;font-size:14.5px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.mini small{display:block;font-size:11.5px;opacity:.75}
.gl.mini b{margin-top:3px;font-size:14.5px}

/* section & list */
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 2px 8px}
.sec h3{font-size:16.5px;font-weight:600}
.sec .lk{font-size:13.5px;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:2px}
.sec .sum{font-size:13px;color:var(--sub);font-weight:500}
.menu{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1 * var(--px));padding:0 var(--px) 2px;scroll-snap-type:x mandatory;scroll-padding:0 var(--px)}
.menu button{scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;line-height:1.2;color:var(--sub);flex-shrink:0;width:58px;text-align:center;font-size:12px}
.menu button:active .tile{transform:scale(.93)}
.stack{display:flex;flex-direction:column;gap:8px}
.tx,.wrow{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);text-align:left}
.tx:active,.wrow:active{background:var(--card2)}
.tx-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left}
.tx-t{display:flex;align-items:baseline;gap:7px;min-width:0}
.tx-t b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-t time{font-size:12px;color:var(--mute);flex-shrink:0}
.tx-s{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;min-width:0}
.tx-s span{overflow:hidden;text-overflow:ellipsis}
.tx-a{font-size:14.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.tx-a.exp{color:var(--exp)} .tx-a.inc{color:var(--inc)} .tx-a.trf{color:var(--sub)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 2px 6px;font-size:13px;color:var(--sub)}
.dh:first-child{margin-top:4px}
.dh b{font-weight:500;font-size:13px;white-space:nowrap}
.cap2{font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.wr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.wr small{font-size:11.5px;color:var(--sub)}
.wr b{font-size:15px;font-weight:600;white-space:nowrap}
.wbar{display:block;height:4px;border-radius:9px;background:var(--card3);overflow:hidden;margin-top:4px;max-width:150px}
.wbar i{display:block;height:100%;border-radius:9px}
.pl{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px}
.pl.up{color:var(--inc);background:rgba(52,210,123,.13)} .pl.dn{color:var(--exp);background:rgba(240,90,102,.13)}
.badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:rgba(52,210,123,.15);color:var(--inc);flex-shrink:0;align-self:center}
.due{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub);white-space:nowrap;flex-shrink:0}
.due.soon{background:rgba(245,165,36,.15);color:var(--warn)}
.due.late{background:rgba(240,90,102,.14);color:var(--exp)}
.pay{padding:8px 14px;border-radius:99px;background:var(--text);color:var(--bg);font-weight:600;font-size:13px;flex-shrink:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:16px}
.mt{margin-top:12px}
.empty{padding:30px 20px;text-align:center;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border-radius:22px}
.empty .tile{background:var(--card2);color:var(--mute);margin-bottom:6px}
.empty b{color:var(--text);font-weight:600}
.empty small{font-size:13px}
.insight{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;margin-top:12px;background:var(--card);box-shadow:var(--shadow)}
.insight p{flex:1;font-size:13.5px;line-height:1.4;color:var(--sub)}
.insight p b{color:var(--text);font-weight:600}
.prog{height:6px;border-radius:9px;background:var(--card3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;transition:width .4s}
.prog.lg{height:9px}
.top2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pct{font-size:13px;color:var(--sub);font-weight:500;white-space:nowrap}
.hint{font-size:12.5px;color:var(--sub);margin:8px 6px 0;line-height:1.45}
.link-btn{display:block;width:100%;text-align:center;color:var(--sub);font-weight:500;font-size:13.5px;padding:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;color:var(--mute);margin-bottom:12px}
.search input{flex:1;border:0;background:none;outline:0;padding:12px 0;color:var(--text)}
.search input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:7px;overflow-x:auto;margin:12px calc(-1 * var(--px)) 0;padding:0 var(--px);scrollbar-width:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 12px;border-radius:99px;background:var(--card);color:var(--sub)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--text);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:500;padding:5px 6px 5px 12px;border-radius:99px;background:var(--card3)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 4px}
.strip>div{text-align:center;position:relative;min-width:0;padding:0 4px}
.strip>div+div:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line)}
.strip small{display:block;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.strip b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* statistik */
.donut-wrap{display:flex;justify-content:center;padding:22px 0 18px}
.donut{position:relative;width:min(64vw,240px);aspect-ratio:1}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dc small{font-size:13px;color:var(--sub)}
.dc b{font-size:21px;font-weight:600;margin-top:2px}
.dc em{font-style:normal;font-size:12px;margin-top:3px;color:var(--sub)}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.crow .nm{width:96px;font-size:14.5px;line-height:1.2;text-align:left;flex-shrink:0}
.crow .prog{flex:1}
.crow .pct{width:42px;text-align:right}
.bars{position:relative;display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;height:100%;align-items:center;gap:6px;min-width:0}
.bars .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bars .b i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;min-height:2px;opacity:.85}
.bars .b.cur i{opacity:1}
.bars .b span{font-size:10.5px;color:var(--sub);height:12px;line-height:12px}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--mute)}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--sub)}
.legend b{color:var(--text);font-weight:600}
.gstack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--card3);gap:2px}
.gstack i{display:block;height:100%}
.glegend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.glegend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub)}
.glegend i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.glegend b{color:var(--text);font-weight:600;margin-left:auto}

/* profil */
.prof{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.prof .avatar{width:56px;height:56px;font-size:20px}
.prof b{display:block;font-size:18px;font-weight:600}
.prof small{color:var(--sub);font-size:13px}
.group{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;position:relative;min-height:56px;text-decoration:none;color:inherit;text-align:left}
.row+.row:before,.field+.field:before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.field+.field:before{left:14px}
.row:active{background:var(--card2)}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{font-size:13.5px;color:var(--sub);white-space:nowrap}
.chev{color:var(--mute)}
.glabel{font-size:12.5px;color:var(--sub);margin:20px 6px 8px;font-weight:500}

/* goals */
.goal{padding:14px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.goal-h{display:flex;align-items:center;gap:12px}
.goal .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);gap:8px}
.goal .meta b{color:var(--text);font-weight:600}
.gacts{display:flex;gap:8px}
.gacts button{flex:1;padding:10px;border-radius:14px;background:var(--card2);font-weight:500;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.gacts button.pri{background:var(--text);color:var(--bg)}

/* navbar */
#nav{position:absolute;left:0;right:0;bottom:calc(10px + var(--sab));z-index:30;display:flex;justify-content:center;pointer-events:none;padding:0 var(--px)}
.nav-in{display:flex;gap:10px;width:100%;max-width:488px}
.nav-pill{pointer-events:auto;flex:1;height:58px;border-radius:29px;background:var(--nav);backdrop-filter:saturate(170%) blur(22px);-webkit-backdrop-filter:saturate(170%) blur(22px);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 7px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
.nav-pill button{flex:1;max-width:76px;height:46px;border-radius:23px;display:grid;place-items:center;color:var(--sub);transition:background .2s,color .2s}
.nav-pill button.on{background:var(--card3);color:var(--text)}
.nav-pill button.on .f{opacity:.9}
.nav-fab{pointer-events:auto;width:58px;height:58px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 10px 26px -8px rgba(0,0,0,.45);transition:transform .15s}
.nav-fab:active{transform:scale(.92)}

/* sheet */
.layer{position:absolute;inset:0;z-index:40}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:calc(520px + 2 * var(--gx));max-height:calc(100% - var(--sat) - 10px);
  background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1)}
.layer.show .backdrop{opacity:1}
.layer.show .sheet{transform:none}
.sh-top{flex-shrink:0;touch-action:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--mute);opacity:.6;margin:8px auto 0}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px calc(12px + var(--gx)) 6px}
.sh-title{font-weight:600;font-size:16.5px;text-align:center}
.sh-btn{padding:8px 4px;color:var(--sub);font-size:15px;font-weight:500;justify-self:start}
.sh-btn.strong{justify-self:end;background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;font-size:14px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px var(--px) calc(24px + var(--sab));overscroll-behavior:contain}
.sh-body.has-foot{padding-bottom:16px}
.sh-foot{flex-shrink:0;padding:10px var(--px) calc(12px + var(--sab));background:var(--bg);border-top:1px solid var(--line)}
.btn.big{padding:14px;font-size:16px;border-radius:16px}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kpad.hide{display:none}
.kpad button{height:46px;border-radius:14px;background:var(--card);font-size:23px;font-weight:500;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.kpad button:active{background:var(--card3)}
.amt input[readonly]{cursor:default;-webkit-user-select:none;user-select:none}
@media (max-height:700px){.kpad button{height:42px;font-size:21px}}
.flabel{font-size:12.5px;font-weight:500;color:var(--sub);margin:14px 6px 7px}
.field{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:52px;position:relative}
.field label{flex-shrink:0;font-weight:500}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:0;text-align:right;padding:13px 0;-webkit-appearance:none;appearance:none;color:var(--sub)}
.field select{direction:rtl;text-overflow:ellipsis}
.field select option,.field select optgroup{direction:ltr}
.field input[type=date]{display:flex;justify-content:flex-end}
.field input::-webkit-date-and-time-value{text-align:right}
.field.full input{text-align:left;color:var(--text)}
.amt-box{background:var(--card);border-radius:20px;padding:12px 14px 10px;text-align:center;margin-top:10px}
.amt-box small{font-size:12.5px;color:var(--sub)}
.amt{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.amt span{font-size:22px;font-weight:500;color:var(--sub)}
.amt input{width:1ch;min-width:1ch;max-width:calc(100% - 40px);padding-right:2px;border:0;background:none;outline:0;font-size:38px;font-weight:600;text-align:center;caret-color:var(--accent);font-variant-numeric:tabular-nums}
.amt-box.exp .amt input{color:var(--exp)} .amt-box.inc .amt input{color:var(--inc)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.deck2{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.deck2 .lcard{position:absolute;left:0;right:0;top:0;transform-origin:50% 0;will-change:transform,opacity;backface-visibility:hidden}
.lc-body{position:absolute;inset:0;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.lc-peek{position:absolute;left:0;right:0;top:0;padding:9px 18px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;z-index:2;opacity:0;pointer-events:none}
.lc-peek span:last-child{font-weight:500;letter-spacing:0;text-transform:none;opacity:.92}
.peek{position:absolute;left:0;right:0;height:56px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 18px;color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 -2px 10px rgba(0,0,0,.18)}
.peek span:last-child{font-weight:500;letter-spacing:0;text-transform:none;opacity:.9}
.lcard{position:relative;height:186px;border-radius:22px;color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;
  box-shadow:0 16px 28px -16px rgba(0,0,0,.6),0 -2px 10px rgba(0,0,0,.15)}
.lcard:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.1);left:-60px;top:-80px}
.lcard:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08);right:-40px;bottom:-70px}
.lc-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.lc-ic{width:44px;height:44px;border-radius:13px;background:#fff;display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.lc-top b{flex:1;font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-type{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.92}
.lc-body>div:last-child{position:relative;z-index:1}
.lcard small{font-size:11px;font-weight:600;letter-spacing:.07em;opacity:.8}
.lc-amt{font-size:28px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--mute);opacity:.5;transition:all .2s}
.dots i.on{width:18px;background:var(--accent);opacity:1}
.swap-in{animation:swapin .3s cubic-bezier(.32,.72,0,1)}
@keyframes swapin{from{transform:translateY(-16px) scale(.97);opacity:.5}to{transform:none;opacity:1}}
.swap-up{animation:swapup .3s cubic-bezier(.32,.72,0,1)}
@keyframes swapup{from{transform:translateY(22px) scale(.97);opacity:.5}to{transform:none;opacity:1}}
.cchips{display:flex;gap:6px;overflow-x:auto;margin:10px calc(-1 * var(--px)) 0;padding:0 var(--px) 2px;scrollbar-width:none}
.cchips::-webkit-scrollbar{display:none}
.cchips.wrap{flex-wrap:wrap;overflow:visible}
.cch{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--card);border:1.5px solid transparent;font-size:13px;color:var(--sub);white-space:nowrap}
.cch.on{border-color:var(--text);color:var(--text)}
.cch.more{padding:7px 12px;color:var(--accent)}
.tile.xs .art{width:20px;height:20px}
.metas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meta{position:relative;display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:12px;background:var(--card);font-size:13px;color:var(--text);max-width:100%;min-width:0}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta>.i:last-of-type{color:var(--mute)}
.meta select,.meta input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.meta.fee input{width:76px;border:0;background:none;outline:0;color:var(--text);font-size:16px;padding:0}
.meta.fee span{color:var(--sub)}
.tv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:6px 0 2px}
.tv-amt{font-size:32px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.tv-amt.exp{color:var(--exp)} .tv-amt.inc{color:var(--inc)}
.tv-cat{font-size:14px;color:var(--sub)}
.tv-note{font-size:15px;margin-top:4px;max-width:90%;word-break:break-word}
.fv{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:7px;text-align:right;color:var(--sub);min-width:0}
.fv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta.hl{background:rgba(236,72,153,.14);color:#EC4899}
.meta.ph{padding:0;gap:0;overflow:hidden}
.meta.ph button{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;color:inherit;font-size:13px}
.meta.ph button:last-child{padding:8px 9px;color:var(--sub);border-left:1px solid var(--line)}
.meta.ph img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.photo-view{padding:16px;background:rgba(0,0,0,.85)}
.photo-view img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain}
.wpick{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--px));padding:2px var(--px);scrollbar-width:none}
.wpick::-webkit-scrollbar{display:none}
.wp{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 12px 8px 8px;border-radius:16px;background:var(--card);border:1.5px solid transparent;text-align:left;max-width:200px}
.wp.on{border-color:var(--text)}
.wp b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp small{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap}
.mprev{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:10px;font-size:13.5px}
.mrow>span:not(.tile){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.ic{flex:0 0 auto}
.mrow b{font-weight:500;white-space:nowrap;font-size:13px}
.mrow em{font-style:normal;font-weight:600}
.smart{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;margin-top:8px;color:var(--accent)}
.smart input{flex:1;min-width:0;border:0;background:none;outline:0;padding:12px 0;color:var(--text)}
.shint{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);margin:6px 6px 0}
.shint:empty{display:none}
.shint b{color:var(--text);font-weight:600}
.flabel.top2{display:flex}
.lk2{font-size:12.5px;color:var(--accent);font-weight:500}
.cg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:18px;background:var(--card);border:1.5px solid transparent;font-size:12px;color:var(--sub);text-align:center;line-height:1.2}
.cg span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cg.on{border-color:var(--text);color:var(--text)}
.cg.add .tile{background:var(--card2);color:var(--sub)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:14px}
.sw{width:30px;height:30px;border-radius:50%}
.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text)}
.igrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px}
.igrid button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;color:var(--sub)}
.igrid button.on{background:var(--card3);color:var(--text)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px}
.lgrid button{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;border:1.5px solid transparent}
.lgrid button.on{border-color:var(--text)}
.lgrid .auto{font-size:11px;color:var(--sub);font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:18px;font-weight:600;background:var(--card)}
.btn.danger{color:var(--exp)}
.btn.primary{background:var(--text);color:var(--bg)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.toggle{position:relative;width:51px;height:31px;border-radius:99px;background:var(--card3);transition:background .2s;flex-shrink:0}
.toggle:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--inc)}
.toggle.on:after{transform:translateX(20px)}
.wd{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;margin-top:4px}
.wd-h{display:flex;align-items:center;gap:11px;position:relative}
.wd-h .tile{background:rgba(255,255,255,.18);color:#fff}
.wd-h b{font-size:16px;font-weight:600}
.wd small{opacity:.75;font-size:12.5px}
.wd-b{font-size:30px;font-weight:600;margin-top:16px;position:relative;font-variant-numeric:tabular-nums}
.wacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.wacts button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0;background:var(--card);border-radius:18px;font-size:12.5px;font-weight:500}

/* alert, action sheet, toast */
.alert-layer{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;padding:30px}
.alert-layer.show{opacity:1}
.alert{width:290px;border-radius:22px;background:var(--card);overflow:hidden;text-align:center;transform:scale(1.06);transition:transform .2s}
.alert-layer.show .alert{transform:none}
.al-t{font-weight:600;padding:20px 16px 4px;font-size:16.5px}
.al-m{font-size:13.5px;color:var(--sub);padding:2px 20px 18px;line-height:1.45}
.al-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.al-b button{padding:12px;text-align:center;border-radius:14px;background:var(--card2);font-weight:600}
.al-b button+button{background:var(--text);color:var(--bg)}
.al-b button.danger{background:var(--exp);color:#fff}
.as-layer{align-items:flex-end;padding:10px 10px calc(10px + var(--sab))}
.as{width:100%;max-width:500px;transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.as-layer.show .as{transform:none}
.as-g{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:8px}
.as-g div{padding:13px;text-align:center;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.as-g button{display:block;width:100%;text-align:center;padding:16px;font-size:16px;font-weight:500}
.as-g button+button{border-top:1px solid var(--line)}
.as-g button.danger{color:var(--exp)}
.as-g button.cancel{font-weight:600}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-160%);z-index:100;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;
  padding:10px 16px;border-radius:99px;display:flex;align-items:center;gap:8px;transition:transform .35s cubic-bezier(.32,.72,0,1);max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast{opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.32,.72,0,1),opacity .2s,visibility .35s}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#toast.err{background:var(--exp);color:#fff}

/* kunci & splash */
#lock,#splash{position:absolute;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .25s}
#lock.out,#splash.out{opacity:0;pointer-events:none}
.lk-in{display:flex;flex-direction:column;align-items:center;width:100%;max-width:300px}
.applogo{width:64px;height:64px;border-radius:22px;background:var(--hero);color:#fff;display:grid;place-items:center}
.lk-t{font-size:18px;font-weight:600;margin:16px 0 4px}
.pinsheet{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
.pdots{display:flex;gap:16px;margin:14px 0 6px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text);transition:background .1s}
.pdots i.on{background:var(--text)}
.pdots.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pmsg{height:18px;font-size:13px;color:var(--exp);font-weight:500;margin-bottom:10px}
.pkeys{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.pkeys button{width:72px;height:72px;border-radius:50%;background:var(--card);font-size:27px;font-weight:500;display:grid;place-items:center}
.pkeys button:active{background:var(--card3)}
.pkeys button[data-k=del]{background:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--sub);font-size:13.5px;text-align:center}
.spin{width:22px;height:22px;border:2.5px solid var(--card3);border-top-color:var(--text);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:360px){
  :root{--px:calc(12px + var(--gx))}
  .hero{padding:18px 12px 12px}.hero-amt{font-size:28px}
  .glass{gap:8px}.gl{padding:10px}.gl b{font-size:14px}.gl-h{gap:5px;font-size:12px}.gl-h i{width:22px;height:22px}
  .tx,.wrow{padding:11px 12px;gap:10px}.tile{width:40px;height:40px;border-radius:13px}
  .tx-t b{font-size:14.5px}.tx-a{font-size:13.5px}.pay{padding:7px 11px}
  .periods button{font-size:13px}.crow .nm{width:80px}.menu button{width:56px}.tile.lg{width:52px;height:52px}
}
</style>
</head>
<body>
<div id="scroll"><header id="hdr"></header>
<main id="app"></main></div>
<nav id="nav"></nav>
<div id="layers"></div>
<div id="toast"></div>
<div id="splash"><div class="sp-in"><div class="applogo" id="sp-logo"></div><div class="spin"></div><span id="sp-msg">Memuat data…</span></div></div>

<script>
/* ========================= Ikon (set duotone khusus DompetKu) =========================

const ICONS = {
  // navigasi

  wallet:'<path class="f" d="M3 8.5A2.5 2.5 0 0 1 5.5 6h13A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h13A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M5.5 6 15 3.6a1.5 1.5 0 0 1 1.9 1.5V6"/><path d="M21 11h-3.5a2 2 0 0 0 0 4H21"/>',

  arrowIn:'<path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/>',

  swap:'<path d="M4 8h15M15.5 4.5 19 8l-3.5 3.5M20 16H5M8.5 12.5 5 16l3.5 3.5"/>',
  chevL:'<path d="m14.5 6-6 6 6 6"/>',

  x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',

// Logo dikenali dari nama akun/tagihan. Akun bisa memilih logo manual (logo: kunci, 'none' = ilustrasi).
const LOGO_MATCH = [
  ['emergency', /darurat|emergency/], ['bca', /\bbca\b/], ['bri', /\bbri\b|brimo/], ['jago', /\bjago\b/], ['ovo', /\bovo\b/],
  ['gopay', /gopay|go pay/], ['dana', /\bdana\b/, /darurat|emergency|cadangan|pensiun|pendidikan/], ['seabank', /sea ?bank/],
  ['shopeepay', /shopee ?pay|\bspay\b/], ['myrepublic', /my ?republic/], ['cash', /\btunai\b|\bcash\b/]
];
function logoKey(name, type) {
  const n = String(name || '').toLowerCase();
  for (const [k, re, not] of LOGO_MATCH) if (LOGOS[k] && re.test(n) && !(not && not.test(n))) return k;
  const t = { cash:'cash', saving:'savings', credit:'credit', paylater:'paylater', invest:'invest' }[type];
  return t && LOGOS[t] ? t : '';
}
const wLogo = w => !w || w.logo === 'none' ? '' : (w.logo && LOGOS[w.logo] ? w.logo : logoKey(w.name, w.type));
const logoImg = (k, size = '') => `<img class="logo ${size}" src="${LOGOS[k]}" alt="">`;
const wicon = (w, size = '') => { const k = wLogo(w); return k ? logoImg(k, size) : itile(wt(w).i, w ? w.color : '#8C8F99', size); };
const wmini = w => { const k = wLogo(w); return k ? `<img class="logo mini" src="${LOGOS[k]}" alt="">` : ic('wallet', 13); };
const recLogo = r => r.logo === 'none' ? '' : (r.logo && LOGOS[r.logo] ? r.logo : logoKey(r.name));
const recIcon = (r, size = '') => { const k = recLogo(r); if (k) return logoImg(k, size); const c = recCat(r); return itile(c.icon, c.color, size); };
// Pilihan logo: otomatis dari nama, logo bawaan/unggahan, ikon biasa, atau unggah baru.
const logoPicker = (cur, fallback) => `<div class="group"><div class="lgrid"><button class="${!cur ? 'on' : ''}" data-f="logo" data-v=""><span class="auto">Otomatis</span></button>
  ${Object.keys(LOGOS).map(k => `<button class="${cur === k ? 'on' : ''}" data-f="logo" data-v="${k}">${logoImg(k, 'sm')}</button>`).join('')}
  <button class="${cur === 'none' ? 'on' : ''}" data-f="logo" data-v="none">${fallback}</button>
  <button data-f="upload" class="up">${ic('plus', 20, 'b')}<small>Upload</small></button></div></div>`;
// Unggah gambar dari HP: dikecilkan ke 96px di perangkat lalu disimpan di sheet Logos. Hasil: kunci logo atau ''.
function uploadLogo(name) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/' + '*'; // tanpa garis miring+bintang: Apps Script menganggapnya awal komentar
    inp.onchange = () => {
      const file = inp.files && inp.files[0]; if (!file) return res('');
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const N = 96, cv = document.createElement('canvas'), x = cv.getContext('2d');
        cv.width = cv.height = N;
        const k = Math.min(N / img.width, N / img.height), w = img.width * k, h = img.height * k;
        x.drawImage(img, (N - w) / 2, (N - h) / 2, w, h);
        URL.revokeObjectURL(url);
        let data = cv.toDataURL('image/webp', .85);
        if (!data.startsWith('data:image/webp')) data = cv.toDataURL('image/png');
        if (data.length > 40000) { x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, N, N); data = cv.toDataURL('image/jpeg', .85); }
        const o = { id:uid(), name:String(name || '').slice(0, 40), data };
        LOGOS['u_' + o.id] = data;
        persist([['saveLogo', o]], () => D.logos.push(o), 'Logo diunggah');
        res('u_' + o.id);
      };
      img.onerror = () => { URL.revokeObjectURL(url); toast('Gambar tidak bisa dibaca', true); res(''); };
      img.src = url;
    };
    inp.click();
  });
}

const PHOTOS = {};
function pickPhoto() {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/' + '*';
    inp.onchange = () => {
      const file = inp.files && inp.files[0]; if (!file) return res(null);
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg', .62));
      };
      img.onerror = () => { URL.revokeObjectURL(url); toast('Foto tidak bisa dibaca', true); res(null); };
      img.src = url;
    };
    inp.click();
  });
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), t = f < 0 ? 255 : 0, p = Math.abs(f);
  const c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round((t - v) * p + v));
  return '#' + c.map(v => pad(v.toString(16))).join('');
}
function shiftMonth(m, d) { let [y, mo] = m.split('-').map(Number); mo += d; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return `${y}-${pad(mo)}`; }
function monthName(m) { const [y, mo] = m.split('-').map(Number); return `${MONTHS[mo - 1]} ${y}`; }

function dateLong(s) {

  return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`;
}
function dateShort(s) { const d = parseD(s); return `${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : ''}`; }

function short(n) {

  if (a >= 1e9) return s + (a / 1e9).toFixed(1).replace('.0', '').replace('.', ',') + 'M';
  if (a >= 1e6) return s + (a / 1e6).toFixed(1).replace('.0', '').replace('.', ',') + 'jt';

// Rentang tanggal untuk Hari/Minggu/Bulan/Tahun/Semua, off = geser periode.
function weekStart(s) { const d = parseD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoDate(d); }
function periodRange(kind, off = 0) {
  const t = today();
  if (kind === 'day') { const d = addDays(t, off); return { from:d, to:d, label:dateLong(d), days:1 }; }
  if (kind === 'week') {
    const f = addDays(weekStart(t), off * 7), to = addDays(f, 6), a = parseD(f), b = parseD(to);
    return { from:f, to, days:7, label:a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}` : `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}` };
  }
  if (kind === 'month') { const m = shiftMonth(thisMonth(), off); return { from:m + '-01', to:`${m}-${pad(daysIn(m))}`, label:monthName(m), m, days:daysIn(m) }; }
  if (kind === 'year') { const y = new Date().getFullYear() + off; return { from:`${y}-01-01`, to:`${y}-12-31`, label:String(y), y, days:365 }; }
  return { from:'0000-01-01', to:'9999-12-31', label:'Semua waktu', days:0 };
}
const inRange = (L, r) => L.filter(t => t.date >= r.from && t.date <= r.to);

function elapsedDays(r) { if (!r.days) return 1; const end = r.to < today() ? r.to : today(); return Math.max(1, dayDiff(r.from, end) + 1); }

function balances(upTo) {
  const b = {};
  D.wallets.forEach(w => b[w.id] = w.initial);
  D.transactions.forEach(t => {
    if (upTo && t.date > upTo) return;
    if (t.type === 'income') b[t.walletId] = (b[t.walletId] || 0) + t.amount;
    else if (t.type === 'expense') b[t.walletId] = (b[t.walletId] || 0) - t.amount;
    else { b[t.walletId] = (b[t.walletId] || 0) - t.amount - t.fee; b[t.toWalletId] = (b[t.toWalletId] || 0) + t.amount; }
  });
  return b;
}
function worth(bal) {
  let liq = 0, inv = 0, cc = 0;
  activeWallets().forEach(w => { const v = bal[w.id] || 0, g = wGroup(w); if (g === 'liquid') liq += v; else if (g === 'invest') inv += v; else cc += Math.max(0, -v); });
  return { liq, inv, cc, net:liq + inv - cc };
}
function sumStats(L) {
  let inc = 0, exp = 0;
  L.forEach(t => {
    if (isSys(t)) return;
    if (t.type === 'income') inc += t.amount;
    else if (t.type === 'expense') exp += t.amount;
    else exp += t.fee;
  });

}

    if (isSys(t)) return;
    if (t.type === type) m[t.categoryId] = (m[t.categoryId] || 0) + t.amount;

// Nilai investasi, modal, dan riwayat nilai dari urutan transaksinya.
function invStats(w) {
  let value = w.initial, modal = w.initial;
  D.transactions.filter(t => t.walletId === w.id || t.toWalletId === w.id)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt < b.createdAt ? -1 : 1))
    .forEach(t => {
      const into = t.toWalletId === w.id || (t.type === 'income' && t.walletId === w.id);
      if (t.categoryId === '__val' || t.categoryId === '__adj') value += t.type === 'income' ? t.amount : -t.amount;
      else if (into) { value += t.amount; modal += t.amount; }
      else { const out = t.amount + (t.fee || 0); modal -= value > 0 ? modal * Math.min(1, out / value) : modal; value -= out; }
    });
  const pl = value - modal;
  return { value, modal, pl, pct:modal > 0 ? pl / modal * 100 : 0 };
}
function debtStats(d) {
  const L = sortTx(D.transactions.filter(t => t.refId === d.id));
  const payType = d.kind === 'hutang' ? 'expense' : 'income';
  const paid = L.filter(t => t.type === payType).reduce((s, t) => s + t.amount, 0);
  return { L, paid, left:Math.max(0, d.amount - paid), done:paid >= d.amount };
}
function goalStats(g, bal) {
  const saved = Math.max(0, bal[g.walletId] || 0), p = g.target ? Math.min(1, saved / g.target) : 0;
  let per = null;
  if (g.due && saved < g.target) per = (g.target - saved) / Math.max(1, Math.ceil(dayDiff(today(), g.due) / 30.44));
  return { saved, p, per, done:saved >= g.target };
}

function addFreq(s, freq, anchor) {
  if (freq === 'daily') return addDays(s, 1);
  if (freq === 'weekly') return addDays(s, 7);
  let [y, m, d] = s.split('-').map(Number);
  if (freq === 'monthly') { m++; if (m > 12) { m = 1; y++; } } else y++;
  return `${y}-${pad(m)}-${pad(Math.min(anchor || d, new Date(y, m, 0).getDate()))}`;
}

function apiFetch(fn, args) {
  return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ fn, args, token:TOKEN }) })
    .then(r => { if (!r.ok) throw new Error('Server tidak merespons (' + r.status + ')'); return r.json(); }, () => { throw new Error('Tidak ada koneksi internet'); })
    .then(j => { if (!j.ok) throw new Error(j.error || 'Gagal'); return j.data; });
}
// Token sesi dari server setelah PIN benar; hanya disimpan di memori.
let TOKEN = '';
function api(fn, ...args) {
  const p = API_URL ? apiFetch(fn, args) : !IS_GAS ? Mock.call(fn, args) : new Promise((res, rej) => {
    const run = google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(e => rej(e instanceof Error ? e : new Error(e && e.message || String(e))));
    if (fn === 'boot' || fn === 'unlock') run[fn](...args); else run.call(TOKEN, fn, args);
  });
  return p.then(r => {
    if (r && r.token) { TOKEN = r.token; delete r.token; }
    return r;
  }, e => {
    if (/SESI_HABIS/.test(e.message)) { e.message = e.message.replace(/^.*SESI_HABIS:\s*/, ''); showLock(false); }
    throw e;
  });
}

function txRow(t, o = {}) {

// Tumpukan kartu yang bergulir: semua kartu dirender sekali, posisinya dihitung dari nilai `pos` (desimal)
// sehingga kartu mengikuti jari secara kontinu lalu berhenti mulus di kartu terdekat.
const DECK = { step:32, h:186 };
function deck(ws, bal) {
  const n = ws.length; S.deckI = ((S.deckI || 0) % n + n) % n;
  return `<div class="deck2" style="height:${DECK.h + DECK.step * Math.min(2, n - 1)}px">${ws.map((w, i) => { const k = wLogo(w);
    return `<div class="lcard" data-i="${i}" data-wid="${w.id}" style="background:linear-gradient(140deg,${shade(w.color, -.12)} 0%,${w.color} 50%,${shade(w.color, .3)} 100%)">
      <div class="lc-peek"><span>${esc(w.name)}</span><span>${money(bal[w.id] || 0)}</span></div>
      <div class="lc-body"><div class="lc-top"><span class="lc-ic">${k ? logoImg(k, 'sm') : itile(wt(w).i, w.color, 'sm')}</span><b>${esc(w.name)}</b><span class="lc-type">${ic('nfc', 15)}${esc(wt(w).l)}</span></div>
      <div><small>SALDO</small><div class="lc-amt">${money(bal[w.id] || 0)}</div></div></div></div>`; }).join('')}</div>
    ${n > 1 ? `<div class="dots">${ws.map((_, j) => `<i class="${j === S.deckI ? 'on' : ''}"></i>`).join('')}</div>` : ''}`;
}
function bindDeck() {
  const el = document.querySelector('.deck2'); if (!el) return;
  const cards = [...el.querySelectorAll('.lcard')], n = cards.length, dots = [...document.querySelectorAll('.dots i')];
  const peeks = Math.min(2, n - 1), { step, h } = DECK;
  let pos = S.deckI, anim = 0, raf = 0;
  const mod = v => ((v % n) + n) % n;
  // d = jarak kartu dari depan: 0 depan, 1-2 mengintip di atas, <0 sedang keluar ke bawah
  const lay = () => {
    raf = 0;
    cards.forEach((c, i) => {
      let d = mod(i - pos); if (d > n - 1) d -= n;
      let y, sc, op, z;
      // kartu yang keluar turun sedikit dan cepat memudar (tidak menimpa daftar di bawahnya)
      if (d < 0) { y = peeks * step - d * h * .28; sc = 1 + d * .04; op = Math.min(1, Math.max(0, 1 + (d + .22) * 3)); z = 45; } // keluar lewat belakang kartu yang masuk
      else { const dd = Math.min(d, peeks); y = (peeks - dd) * step; sc = 1 - dd * .05; op = d > peeks ? Math.max(0, peeks + 1 - d) : 1; z = 50 - Math.round(d * 10); }
      const clamp = v => Math.min(1, Math.max(0, v));
      c.style.transform = `translate3d(0,${y.toFixed(1)}px,0) scale(${sc.toFixed(4)})`;
      c.style.opacity = op.toFixed(3); c.style.zIndex = z;
      // isi kartu dan label intip tidak tampil bersamaan
      c.querySelector('.lc-peek').style.opacity = clamp((d - .55) * 3).toFixed(3);
      c.querySelector('.lc-body').style.opacity = (d < 0 ? 1 : clamp(1 - (d - .2) * 2.8)).toFixed(3);
    });
    const on = mod(Math.round(pos)); dots.forEach((x, j) => x.classList.toggle('on', j === on));
  };
  const queue = () => { if (!raf) raf = requestAnimationFrame(lay); };
  const settle = target => {
    cancelAnimationFrame(anim);
    const from = pos, t0 = performance.now(), dur = Math.min(520, 260 + Math.abs(target - from) * 160);
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      pos = from + (target - from) * e; lay();
      if (k < 1) anim = requestAnimationFrame(tick); else { pos = target; S.deckI = mod(target); lay(); }
    };
    anim = requestAnimationFrame(tick);
  };
  let y0 = null, p0 = 0, moved = false, vy = 0, lastY = 0, lastT = 0;
  el.addEventListener('pointerdown', e => {
    cancelAnimationFrame(anim); y0 = lastY = e.clientY; lastT = performance.now(); p0 = pos; moved = false; vy = 0;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', e => {
    if (y0 === null) return;
    const now = performance.now(), dy = e.clientY - y0;
    if (Math.abs(dy) > 5) moved = true;
    vy = .8 * vy + .2 * ((e.clientY - lastY) / Math.max(1, now - lastT)); lastY = e.clientY; lastT = now;
    pos = p0 + dy / h; queue();
  });
  const end = e => {
    if (y0 === null) return;
    y0 = null;
    if (!moved) {
      // ketuk: kartu depan membuka detail, kartu yang mengintip dibawa ke depan
      const c = e && e.target.closest && e.target.closest('.lcard'); if (!c) return settle(Math.round(pos));
      const i = +c.dataset.i, front = mod(Math.round(pos));
      if (i === front) { settle(Math.round(pos)); openWallet(c.dataset.wid); }
      else { let d = mod(i - pos); if (d > n / 2) d -= n; settle(Math.round(pos + d)); }
      return;
    }
    const fling = Math.max(-1, Math.min(1, vy * 100 / h)); // dorongan cepat menambah maks. 1 kartu
    settle(Math.round(pos + fling));
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  lay();
}

/* ========================= Halaman: Anggaran ========================= */
function budgetItems(m) {
  const spent = spentByCat(monthTx(m));
  return D.budgets.map(b => ({ b, c:cat(b.categoryId), spent:spent[b.categoryId] || 0 }))
    .filter(x => D.categories.some(c => c.id === x.b.categoryId))
    .sort((a, b) => b.spent / b.b.amount - a.spent / a.b.amount);
}
function budgetRow(x) {
  const p = x.spent / x.b.amount, left = x.b.amount - x.spent;
  return `<button class="wrow" data-act="budget" data-id="${x.b.id}">${itile(x.c.icon, x.c.color)}
    <span class="tx-m"><span class="top2"><b style="font-weight:500;font-size:15px">${esc(x.c.name)}</b><span class="pct" style="color:${progColor(p)}">${Math.round(p * 100)}%</span></span>
    <span class="prog" style="margin:4px 0 2px"><i style="width:${Math.min(p, 1) * 100}%;background:${progColor(p)}"></i></span>
    <span class="top2"><span class="rs">${S.hide ? '' : `${short(x.spent)} / ${short(x.b.amount)}`}</span><span class="rs" style="${left < 0 ? 'color:var(--exp)' : ''}">${left < 0 ? 'Lebih ' + money(-left) : 'Sisa ' + money(left)}</span></span></span></button>`;
}
function vBudget() {
  const items = budgetItems(S.month);
  const tb = items.reduce((s, x) => s + x.b.amount, 0), ts = items.reduce((s, x) => s + x.spent, 0), p = tb ? ts / tb : 0;
  const cur = S.month === thisMonth(), left = daysIn(S.month) - new Date().getDate() + 1;
  const unb = Object.entries(spentByCat(monthTx(S.month))).filter(([id]) => !D.budgets.some(b => b.categoryId === id) && id !== '__fee').reduce((s, [, v]) => s + v, 0);
  if (!items.length) return `${monthNav()}${empty('pie', 'Belum ada anggaran', 'Batasi pengeluaran per kategori setiap bulan')}

    <div class="top2" style="margin-top:9px;font-size:12.5px;opacity:.8"><span>Terpakai ${money(ts)} dari ${money(tb)}</span>${cur && tb - ts > 0 ? `<span>${money((tb - ts) / left)}/hari</span>` : ''}</div>

}

/* ========================= Halaman: Berulang & Tagihan ========================= */
const recTabs = () => `<div class="seg">${[['bill', 'Tagihan'], ['cal', 'Kalender'], ['auto', 'Otomatis']].map(([k, l]) => `<button class="${S.recTab === k ? 'on' : ''}" data-act="recTab" data-id="${k}">${l}</button>`).join('')}</div>`;
// Kejadian tagihan/berulang dalam satu bulan: jadwal mendatang + yang sudah dibayar (transaksi dengan refId).
function billEvents(m) {
  const from = m + '-01', to = `${m}-${pad(daysIn(m))}`, ev = [];
  D.recurring.forEach(r => {
    if (!r.active || !r.next) return;
    for (let d = r.next, n = 0; d <= to && n < 400; d = addFreq(d, r.freq, anchorOf(r)), n++) if (d >= from) ev.push({ r, d, st:r.auto ? 'auto' : d < today() ? 'late' : 'due' });
  });
  D.transactions.forEach(t => {
    if (!t.refId || t.date < from || t.date > to) return;
    const r = D.recurring.find(x => x.id === t.refId); if (r) ev.push({ r, d:t.date, st:'paid', t });
  });
  return ev.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
}
function evRow(e) {
  const r = e.r, amt = e.t ? e.t.amount : r.amount, dl = dueLabel(e.d);
  const badge = e.st === 'paid' ? '<span class="due paid">Lunas</span>' : e.st === 'auto' ? '<span class="due auto">Otomatis</span>' : `<span class="due ${dl.c}">${dl.t}</span>`;
  const payable = e.st !== 'paid' && !r.auto && e.d === r.next;
  return `<div class="tx">${recIcon(r)}<button class="tx-m" data-act="recur" data-id="${r.id}"><span class="tx-t"><b>${esc(r.name)}</b></span>
    <span class="tx-s">${badge}<span>${dateShort(e.d)} · ${FREQ[r.freq]}</span></span></button>
    ${payable ? `<button class="pay" data-act="payBill" data-id="${r.id}">Bayar</button>` : `<span class="wr"><b class="${r.type === 'income' ? 'inc' : ''}">${money(amt)}</b></span>`}</div>`;
}
function vCal() {
  const m = S.calM, ev = billEvents(m), byDay = {};
  ev.forEach(e => (byDay[e.d] = byDay[e.d] || []).push(e));
  const lead = (parseD(m + '-01').getDay() + 6) % 7, cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span></span>');
  for (let d = 1; d <= daysIn(m); d++) {
    const ds = `${m}-${pad(d)}`, L = byDay[ds] || [];
    const cls = (ds === today() ? ' today' : '') + (ds === S.calDay ? ' sel' : '') + (L.some(e => e.st === 'late') ? ' late' : '');
    cells.push(`<button class="cd${cls}" data-act="calDay" data-id="${ds}"><span class="cn">${d}</span><span class="ce">${L.slice(0, 2).map(e => `<i class="${e.st}">${recIcon(e.r, 'mn')}</i>`).join('')}${L.length > 2 ? `<em>+${L.length - 2}</em>` : ''}</span></button>`);
  }
  const out = e => e.r.type !== 'income';
  const unpaid = ev.filter(e => e.st !== 'paid' && out(e)).reduce((s, e) => s + e.r.amount, 0);
  const paid = ev.filter(e => e.st === 'paid' && out(e)).reduce((s, e) => s + e.t.amount, 0);
  const list = S.calDay ? byDay[S.calDay] || [] : ev;
  return `${recTabs()}
  <div class="pnav"><button data-act="calMove" data-id="-1">${ic('chevL', 20, 'b')}</button><b>${monthName(m)}</b><button data-act="calMove" data-id="1">${ic('chevR', 20, 'b')}</button></div>
  <div class="card cal"><div class="cw">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(x => `<span>${x}</span>`).join('')}</div><div class="c7">${cells.join('')}</div></div>
  <div class="strip mt" style="grid-template-columns:1fr 1fr"><div><small>Belum dibayar</small><b class="exp">${money(unpaid)}</b></div><div><small>Sudah dibayar</small><b class="inc">${money(paid)}</b></div></div>
  <div class="sec"><h3>${S.calDay ? dateLong(S.calDay) : 'Bulan ini'}</h3>${S.calDay ? '<button class="lk" data-act="calDay" data-id="">Lihat semua</button>' : `<span class="sum">${ev.length} jadwal</span>`}</div>
  <div class="stack">${list.length ? list.map(evRow).join('') : empty('calendar', 'Tidak ada tagihan', S.calDay ? 'Tidak ada jadwal di tanggal ini' : 'Tambahkan tagihan atau langganan')}</div>
  <button class="btn primary mt" data-act="addRecur">${ic('plus', 18, 'b')}Tambah Tagihan</button>`;
}
function vRecur() {
  if (S.recTab === 'cal') return vCal();
  const bill = S.recTab === 'bill';
  const L = D.recurring.filter(r => r.auto === !bill).sort((a, b) => (b.active - a.active) || (a.next < b.next ? -1 : 1));
  const monthly = L.filter(r => r.active && r.type !== 'income').reduce((s, r) => s + r.amount * ({ daily:30, weekly:4.33, monthly:1, yearly:1 / 12 }[r.freq] || 1), 0);
  const row = r => { const c = recCat(r), d = dueLabel(r.next);
    return `<button class="tx" style="${r.active ? '' : 'opacity:.5'}" data-act="${bill && r.active ? 'recurMenu' : 'recur'}" data-id="${r.id}">${recIcon(r)}
      <span class="tx-m"><span class="tx-t"><b>${esc(r.name)}</b></span>
      <span class="tx-s"><span>${FREQ[r.freq]} · ${esc(nm(wal(r.walletId)))}</span></span></span>
      <span class="wr"><b class="${r.type === 'income' ? 'inc' : ''}">${money(r.amount)}</b>${r.active ? (bill ? `<span class="due ${d.c}">${d.t}</span>` : `<small>${dateShort(r.next)}</small>`) : '<small>Nonaktif</small>'}</span></button>`; };
  return `${recTabs()}

  <div class="stack mt">${L.length ? L.map(row).join('') : empty(bill ? 'receipt' : 'repeat', bill ? 'Belum ada tagihan' : 'Belum ada transaksi berulang', bill ? 'Listrik, kos, langganan — dapat pengingat & bayar sekali ketuk' : 'Gaji, nabung rutin, langganan — dicatat otomatis saat jatuh tempo')}</div>

  <p class="hint">${bill ? 'Ketuk tagihan untuk bayar, lewati, atau edit. Membayar akan mencatat transaksi dan memajukan jatuh tempo.' : 'Transaksi dicatat otomatis setiap kali aplikasi dibuka dan sudah jatuh tempo.'}</p>`;
}

/* ========================= Halaman: Riwayat & Utang ========================= */
function vTx() {

}
function filteredTx() {
  const f = S.f, q = f.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  let L = q ? D.transactions : monthTx(S.month);
  if (f.type !== 'all') L = L.filter(t => t.type === f.type);

  return sortTx(L);
}
function drawTxList() {

}

function openSheet({ title, left = 'Batal', right, onRight, body = '', onClose }) {
  // Tombol simpan besar di bawah (mudah dijangkau jempol); tombol lain (mis. Edit) tetap di kepala.
  const big = right && /^(Simpan|Pindahkan)$/.test(right);
  const el = document.createElement('div');
  el.className = 'layer';
  el.innerHTML = `<div class="backdrop"></div><div class="sheet"><div class="sh-top"><div class="grab"></div>
    <div class="sh-head"><button class="sh-btn" data-x>${left}</button><div class="sh-title">${title}</div>${right && !big ? `<button class="sh-btn strong" data-r>${right}</button>` : '<span></span>'}</div></div>
    <div class="sh-body${big ? ' has-foot' : ''}">${body}</div>
    ${big ? `<div class="sh-foot"><div class="kpad hide">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'del'].map(k => `<button data-k="${k}">${k === 'del' ? ic('del', 24) : k}</button>`).join('')}</div>
      <button class="btn primary big" data-r>${ic('check', 20, 'b')}${right}</button></div>` : ''}</div>`;
  el._onClose = onClose;
  $('#layers').appendChild(el);
  document.body.classList.add('locked');
  el.offsetHeight; el.classList.add('show');
  el.querySelector('.backdrop').onclick = () => closeSheet(el);
  el.querySelector('[data-x]').onclick = () => closeSheet(el);
  if (right) el.querySelector('[data-r]').onclick = () => onRight(el);
  // geser ke bawah untuk menutup
  const sh = el.querySelector('.sheet'), top = el.querySelector('.sh-top'); let y0 = null, dy = 0;
  top.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive:true });
  top.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive:true });
  top.addEventListener('touchend', () => { sh.style.transition = ''; sh.style.transform = ''; if (dy > 90) closeSheet(el); y0 = null; });
  el.body = el.querySelector('.sh-body');
  const pad = el.querySelector('.kpad');
  // Nominal diisi lewat keypad aplikasi: keyboard iOS tidak muncul, jadi halaman tidak ikut bergeser.
  const syncAmt = () => {
    const inputs = el.body.querySelectorAll('.amt input');
    inputs.forEach(i => { fitAmt(i); if (pad) { i.readOnly = true; i.setAttribute('inputmode', 'none'); } });
    if (pad && !el.body.contains(document.activeElement)) pad.classList.toggle('hide', !inputs.length);
  };
  new MutationObserver(syncAmt).observe(el.body, { childList:true, subtree:true });
  if (pad) {
    // pointerdown: langsung saat jari menyentuh, sebelum tata letak sempat bergeser (keyboard menutup, keypad muncul)
    pad.addEventListener('pointerdown', e => {
      const b = e.target.closest('[data-k]'), inp = el.body.querySelector('.amt input'); if (!b || !inp) return;
      e.preventDefault();
      let s = String(digits(inp.value) || '');
      if (b.dataset.k === 'del') s = s.slice(0, -1); else if (s.length < 13) s = (s + b.dataset.k).replace(/^0+/, '');
      inp.value = s;
      inp.dispatchEvent(new Event('input', { bubbles:true }));
    });
    el.body.addEventListener('focusin', e => { if (e.target.matches('input:not([readonly]), select, textarea')) pad.classList.add('hide'); });
    el.body.addEventListener('focusout', () => setTimeout(() => {
      const a = document.activeElement;
      if (!(a && el.body.contains(a) && a.matches('input:not([readonly]), select, textarea'))) pad.classList.toggle('hide', !el.body.querySelector('.amt input'));
    }, 60));
    setTimeout(syncAmt);
  }
  return el;
}
function closeSheet(el) {
  if (!el || el._closing) return;
  el._closing = true; el._refresh = null;
  const a = document.activeElement; if (a && el.contains(a) && a.blur) a.blur();
  el.classList.remove('show');
  if (el._onClose) el._onClose();
  setTimeout(() => { el.remove(); if (!$('#layers').children.length) document.body.classList.remove('locked'); resetViewport(); }, 320);
}
// iOS: setelah keyboard menutup, jendela bisa tertinggal ter-scroll. Tampilan terlihat normal tetapi titik sentuh
// meleset (tombol keypad "bergeser" satu baris) dan aplikasi terasa macet. Kembalikan scroll jendela ke 0.
function resetViewport() {
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
  if (document.documentElement.scrollTop) document.documentElement.scrollTop = 0;
  if (document.body.scrollTop) document.body.scrollTop = 0;
}
const isTyping = () => { const a = document.activeElement; return !!a && a.matches('input:not([readonly]), select, textarea'); };
document.addEventListener('focusout', () => setTimeout(() => { if (!isTyping()) resetViewport(); }, 80));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { if (!isTyping()) setTimeout(resetViewport, 50); });
window.addEventListener('scroll', () => { if (!isTyping()) resetViewport(); });

const INCOME_HINT = /\b(gaji|gajian|salary|bonus|thr|insentif|komisi|dividen|deviden|omzet|omset|jualan|penjualan|terima|diterima|dapat|dapet|dikasih|refund|cashback|pemasukan|cair|untung|profit|freelance|honor)\b/;
const STOP = new Set('di ke dari untuk buat utk dan yg yang sama beli bayar isi the of to for and ya aja lagi nya pak bu mas mbak kak rp idr ini itu tadi td hari pagi siang sore malam kemarin besok sm dgn dengan buat bwt bareng bulanan mingguan harian tahunan rutin bulan minggu tahun biaya bank uang total baru lama'.split(' '));
const AMT_RE = /(?:^|\s)(?:rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(rb|ribu|rbu|k|jt|juta|jeti)?(?=\s|$)/i;

// "kopi 25rb" → 25000, "1,5jt" → 1500000, "25.000" → 25000. Angka kecil tanpa satuan diabaikan (mis. "2 porsi").
function parseAmount(s) {
  const m = String(s || '').match(AMT_RE); if (!m) return null;
  const num = m[1], suf = (m[2] || '').toLowerCase();
  let v = /^\d{1,3}([.,]\d{3})+$/.test(num) ? Number(num.replace(/[.,]/g, '')) : parseFloat(num.replace(',', '.'));
  v = Math.round(v * ({ rb:1e3, ribu:1e3, rbu:1e3, k:1e3, jt:1e6, juta:1e6, jeti:1e6 }[suf] || 1));
  if (!suf && v < 500) return null;
  return v > 0 ? { v, text:m[0].trim() } : null;
}
const stripAmt = s => { const p = parseAmount(s); return p ? s.replace(p.text, ' ') : s; };
const normTxt = s => String(s || '').toLowerCase().replace(/[^a-z0-9&]+/g, ' ').replace(/\s+/g, ' ').trim();
const ruleCat = r => { const L = cats(r.type); return L.find(c => c.icon === r.icon) || L.find(c => r.name.test(c.name.toLowerCase())); };
const fallbackCat = type => { const L = cats(type); return L.find(c => /^lain/i.test(c.name)) || L.find(c => c.icon === 'dots' || c.icon === 'coins') || L[L.length - 1]; };

let _learn = null, _learnKey = '';
function learnIndex() {
  const last = D.transactions[D.transactions.length - 1];
  const key = D.transactions.length + ':' + (last ? last.id + last.categoryId : '');
  if (key === _learnKey) return _learn;
  const exact = {}, tok = {};
  sortTx(D.transactions).slice(0, 4000).reverse().forEach(t => {
    if (!t.note || t.type === 'transfer' || isSys(t) || !D.categories.some(c => c.id === t.categoryId)) return;
    const n = normTxt(stripAmt(t.note)); if (!n) return;
    exact[t.type + '|' + n] = t.categoryId;
    new Set(n.split(' ')).forEach(w => {
      if (w.length < 3 || STOP.has(w) || /^\d+$/.test(w)) return;
      const k = t.type + '|' + w; tok[k] = tok[k] || {}; tok[k][t.categoryId] = (tok[k][t.categoryId] || 0) + 1;
    });
  });
  _learnKey = key;
  return _learn = { exact, tok };
}
// Hasil: { cat, type, why:'riwayat'|'kamus' } atau null. canSwitch = boleh pindah pengeluaran ⇄ pemasukan.
function smartGuess(text, type, canSwitch) {
  const n = normTxt(stripAmt(text)); if (n.length < 2) return null;
  const other = type === 'expense' ? 'income' : 'expense';
  const outHint = EXPENSE_HINT.test(n), inHint = !outHint && INCOME_HINT.test(n);
  const types = canSwitch && type !== 'transfer' && !(type === 'expense' && outHint) ? [type, other] : [type];
  // kata seperti "bayar/beli" condong ke pengeluaran, "gaji/refund/dapat" condong ke pemasukan
  const weight = t => t === 'income' ? (inHint ? 1.3 : outHint ? .7 : t === type ? 1 : .8) : (t === type ? 1 : .8);
  const L = learnIndex(), padded = ' ' + n + ' ';
  let best = null;
  const consider = (score, catId, t, why) => { if (!best || score > best.score) best = { score, catId, t, why }; };
  types.forEach(t => {
    const w = weight(t);
    if (L.exact[t + '|' + n]) consider(100 * w, L.exact[t + '|' + n], t, 'riwayat');
    const tally = {};
    n.split(' ').forEach(word => { const m = L.tok[t + '|' + word]; if (m) Object.entries(m).forEach(([c, k]) => tally[c] = (tally[c] || 0) + Math.min(k, 8)); });
    // satu kata yang pernah dipakai: sinyal sedang (maks 18), kalah dari frasa kamus yang spesifik
    Object.entries(tally).forEach(([c, k]) => consider((8 + Math.min(k, 5) * 2) * w, c, t, 'riwayat'));
  });
  SMART.forEach(r => {
    if (!types.includes(r.type)) return;
    let hit = 0;
    r.words.forEach(k => { if (padded.includes(' ' + k + ' ') || (k.length >= 5 && padded.includes(' ' + k))) hit = Math.max(hit, 12 + k.length + (k.includes(' ') ? 8 : 0) + (r.spec ? 3 : 0)); });
    if (!hit) return;
    const c = ruleCat(r); if (c) consider(hit * weight(r.type), c.id, r.type, 'kamus');
  });
  if (!best) return null;
  const c = D.categories.find(x => x.id === best.catId);
  return c ? { cat:c, type:best.t, why:best.why } : null;
}
// Kategori yang paling sering dipakai 120 hari terakhir (untuk pilihan cepat).
function topCats(type, n) {
  const from = addDays(today(), -120), cnt = {};
  D.transactions.forEach(t => { if (t.type === type && t.date >= from && !isSys(t)) cnt[t.categoryId] = (cnt[t.categoryId] || 0) + 1; });
  return cats(type).slice().sort((a, b) => (cnt[b.id] || 0) - (cnt[a.id] || 0) || (+a.order || 0) - (+b.order || 0)).slice(0, n);
}
